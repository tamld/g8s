version: 2

project_name: g8s

before:
  hooks:
    - go mod tidy

builds:
  - id: g8s
    main: ./cmd/g8s
    binary: g8s
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}
  - id: g8s-windows
    main: ./cmd/g8s
    binary: g8s
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - amd64
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}

universal_binaries:
  - id: darwin_all
    ids:
      - g8s
    replace: true

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - docs/*
      - spec/constitution.md
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

nfpms:
  - package_name: g8s
    vendor: TamLD
    homepage: https://github.com/tamld/g8s
    maintainer: TamLD <tamld@users.noreply.github.com>
    description: Zero-CGO pure-Go harness orchestrating AI subagents
    license: MIT
    file_name_template: "{{ .ConventionalFileName }}"
    formats:
      - deb
      - rpm
      - apk

homebrew_casks:
  - repository:
      owner: tamld
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    homepage: "https://github.com/tamld/g8s"
    description: "Zero-CGO pure-Go harness orchestrating AI subagents"
    license: "MIT"
