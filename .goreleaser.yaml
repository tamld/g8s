version: 2

project_name: g8s

before:
  hooks:
    - go mod tidy

builds:
  - id: g8s
    main: ./cmd/g8s
    binary: g8s
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}
      - -X main.Commit={{.Commit}}
      - -X main.BuildTime={{.Date}}
  - id: g8s-windows
    main: ./cmd/g8s
    binary: g8s
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - amd64
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}
      - -X main.Commit={{.Commit}}
      - -X main.BuildTime={{.Date}}

universal_binaries:
  - id: darwin_all
    ids:
      - g8s
    replace: true

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - docs/*
      - spec/constitution.md
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: tamld
    name: g8s
  draft: false
  prerelease: auto
  header: |
    ## 🚀 g8s {{ .Tag }} (The Gatekeepers)

    > Zero-CGO pure-Go process execution and capability harness for AI subagents.

    ### 📦 Downloads & Platform Matrix

    | Platform | Architecture | Binary / Archive |
    |:---|:---|:---|
    | **macOS (Apple Silicon)** | `darwin/arm64` (M1/M2/M3/M4) | `g8s_{{ .Version }}_darwin_arm64.tar.gz` |
    | **macOS (Intel)** | `darwin/amd64` (x86_64) | `g8s_{{ .Version }}_darwin_amd64.tar.gz` |
    | **Linux** | `linux/amd64` | `g8s_{{ .Version }}_linux_amd64.tar.gz` (also `.deb`, `.rpm`, `.apk`) |
    | **Linux** | `linux/arm64` | `g8s_{{ .Version }}_linux_arm64.tar.gz` (also `.deb`, `.rpm`, `.apk`) |
    | **Windows** | `windows/amd64` | `g8s_{{ .Version }}_windows_amd64.zip` |

    ### 🔒 Verification
    Verify artifact integrity against published SHA-256 hashes:
    ```bash
    sha256sum -c checksums.txt
    ```

    ### 🔄 Changes in this Release
  footer: |
    ---
    ### ⚡ Quick Update
    If you already have `g8s` installed, check your version anytime with:
    ```bash
    g8s version --check-update
    ```

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

nfpms:
  - package_name: g8s
    vendor: TamLD
    homepage: https://github.com/tamld/g8s
    maintainer: TamLD <tamld@users.noreply.github.com>
    description: Zero-CGO pure-Go harness orchestrating AI subagents
    license: MIT
    file_name_template: "{{ .ConventionalFileName }}"
    formats:
      - deb
      - rpm
      - apk

homebrew_casks:
  - repository:
      owner: tamld
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    homepage: "https://github.com/tamld/g8s"
    description: "Zero-CGO pure-Go harness orchestrating AI subagents"
    license: "MIT"
