# GoReleaser Configuration for g8s
version: 2

project_name: g8s

before:
  hooks:
    - go mod tidy

builds:
  - id: g8s
    main: ./cmd/g8s
    binary: g8s
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}

archives:
  - id: default
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE
      - docs/*
      - spec/constitution.md

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

nfpms:
  - package_name: g8s
    vendor: TamLD
    homepage: https://github.com/tamld/g8s
    maintainer: TamLD <tamld@users.noreply.github.com>
    description: Zero-CGO pure-Go harness orchestrating AI subagents
    license: MIT
    formats:
      - deb
      - rpm
      - apk

brews:
  - repository:
      owner: tamld
      name: homebrew-tap
      branch: main
      token: "{{ if index .Env \"HOMEBREW_TAP_GITHUB_TOKEN\" }}{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}{{ else }}{{ .Env.GITHUB_TOKEN }}{{ end }}"
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    homepage: "https://github.com/tamld/g8s"
    description: "Zero-CGO pure-Go harness orchestrating AI subagents"
    license: "MIT"
    test: |
      system "#{bin}/g8s --version"


