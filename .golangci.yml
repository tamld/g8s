version: "2"

linters:
  enable:
    - staticcheck
    - errcheck
    - gosec
    - govulncheck
    - gocognit
    - revive
    - misspell
  disable-all: true

linters-settings:
  staticcheck:
    checks: ["all", "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022", "-ST1023"]
    go: "1.25"
  errcheck:
    exclude: ".errcheck_excludes"
    check-type-assertions: true
    check-blank: true
  gosec:
    excludes:
      - G104
      - G122
      - G204
      - G301
      - G302
      - G304
      - G306
      - G702
      - G703
      - G704
    exclude-dirs:
      - internal/supervisor
      - reference
  govulncheck:
    mode: extract
  gocognit:
    min-complexity: 15
  revive:
    rules:
      - name: unused-parameter
      - name: unused-receiver
      - name: blank-imports
      - name: redefines-builtin-id

issues:
  exclude-rules:
    - path: internal/supervisor
    - path: reference
    - path: _test\.go
  exclude-use-default: false

output:
  format: colored-line-number
  print-issued-lines: true
  print-linter-name: true
