# Nightly CI (ADR-0031): scheduled when PR lanes may skip docs-only paths.
# Runs: gofmt, gofumpt, go vet, golangci-lint, go test ./... (CGO=0),
# go test -race ./internal/... (CGO=1), bounded Fuzz* targets (-fuzztime 10s each).
# Crash-survival / golden-loop live elsewhere; no Windows/macOS matrix (cost discipline).

name: Nightly Full Battery

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-full-battery
  cancel-in-progress: true

jobs:
  surface-inventory:
    name: surface-inventory
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: surface-inventory
        run: bash tools/ci_surface_inventory.sh
      - name: cli-reference vs --help
        run: bash tools/ci_cli_reference_check.sh

  nightly-battery:
    name: Nightly Full Battery
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
      CGO_ENABLED: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Go (1.25 for golangci-lint compatibility with go.mod)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.11'
          cache: true

      - name: prune-law gate & reflection cycle (D-09)
        shell: bash
        run: |
          set -euo pipefail
          CGO_ENABLED=0 go build -o ./bin/g8s ./cmd/g8s
          state="$(mktemp -d)"
          trap 'rm -rf "$state"' EXIT
          mkdir -p "$state/reflection-receipts"
          now_utc="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"

          jq -n --arg ts "$now_utc" '{
            receipt_id: "nightly-fixture-001",
            cycle: { timestamp: $ts, trigger: "nightly" },
            judge: { name: "g8s-nightly-fixture", version: "1.0.0" },
            verdicts: [
              {
                artifact_path: "docs/OPERATIONS.md",
                dimension: "drift",
                verdict: "healthy",
                evidence_refs: ["run:nightly-fixture-001"]
              },
              {
                artifact_path: "docs/legacy-process.md",
                dimension: "staleness",
                verdict: "stale",
                evidence_refs: ["run:nightly-fixture-001"]
              }
            ],
            add_list: ["docs/OPERATIONS.md"],
            prune_list: ["docs/legacy-process.md"],
            prune_ratio: 1,
            self_tombstone_after: 3
          }' >"$state/reflection-latest.json"
          cp "$state/reflection-latest.json" "$state/reflection-receipts/cycle-001.json"

          G8S_REFLECTION_TOMBSTONE="$state/reflection-TOMBSTONED" \
            bash tools/ci_process_prune_ratio.sh "$state/reflection-receipts"
          test ! -e "$state/reflection-TOMBSTONED"

          first_id=$(G8S_STATE_DIR="$state" AGY_MCP_ALLOW_WORKSPACE_WRITE=1 ./bin/g8s autopilot tick -reflection-receipt "$state/reflection-latest.json" --json | jq -er '.data.task_id')
          second_id=$(G8S_STATE_DIR="$state" AGY_MCP_ALLOW_WORKSPACE_WRITE=1 ./bin/g8s autopilot tick -reflection-receipt "$state/reflection-latest.json" --json | jq -er '.data.task_id')
          if [ "$first_id" != "$second_id" ]; then
            echo "::error::D-09 idempotency failed: $first_id != $second_id"
            exit 1
          fi
          G8S_STATE_DIR="$state" ./bin/g8s get "$first_id" --json | jq -e '.data.state == "QUEUED"'

      - name: Check formatting (gofmt)
        shell: bash
        run: |
          unformatted=$(gofmt -l . | grep -v '^reference/' || true)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Check formatting (gofumpt - pre-push parity)
        shell: bash
        run: |
          unformatted=$(gofumpt -l . | grep -v '^reference/' || true)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofumpt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Install golangci-lint (bundles staticcheck, errcheck, gosec, govulncheck, gocognit)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: latest
          args: --timeout=10m

      - name: golangci-lint (staticcheck, errcheck, gosec, govet, ineffassign, unused)
        run: golangci-lint run

      - name: Test plain build (Zero-CGO)
        run: CGO_ENABLED=0 go test ./... -count=1

      - name: Test race detector
        run: go test -race -count=1 ./internal/...
        env:
          CGO_ENABLED: '1'

      - name: Bounded fuzzing (external-input parsers)
        shell: bash
        run: |
          go test -run '^$' -fuzz FuzzConfigLoad -fuzztime 10s ./internal/config/
          go test -run '^$' -fuzz FuzzReceiptEnvelope -fuzztime 10s ./internal/receipt/
          go test -run '^$' -fuzz FuzzWorkerResultParse -fuzztime 10s ./internal/worker/
          go test -run '^$' -fuzz FuzzSanitizeOutput -fuzztime 10s ./internal/dispatch/
          go test -run '^$' -fuzz FuzzVerifyScope -fuzztime 10s ./internal/fsops/
          go test -run '^$' -fuzz FuzzReadAndEdit -fuzztime 10s ./internal/fsops/
          go test -run '^$' -fuzz FuzzSelectPath -fuzztime 10s ./internal/cli/
