# Nightly full-battery CI — catches test drift when PR lanes skip docs-only paths (ADR-0031).

name: Nightly Full Battery

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-full-battery
  cancel-in-progress: true

jobs:
  nightly-battery:
    name: Nightly Full Battery
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
      CGO_ENABLED: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Go (1.25 for golangci-lint compatibility with go.mod)
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.10'
          cache: true

      - name: Check formatting (gofmt)
        shell: bash
        run: |
          unformatted=$(gofmt -l . | grep -v '^reference/' || true)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Install golangci-lint (bundles staticcheck, errcheck, gosec, govulncheck, gocognit)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: latest
          args: --timeout=10m
          skip-pkg-cache: true

      - name: golangci-lint (staticcheck, errcheck, gosec, govet, ineffassign, unused)
        run: golangci-lint run

      - name: Test plain build (Zero-CGO)
        run: CGO_ENABLED=0 go test ./... -count=1
