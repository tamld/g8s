# dist-validation.yml — Automated GoReleaser Dry-Run & Packaging Validation Gate
name: Dist Validation

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.goreleaser.yaml'
      - '.github/workflows/dist-validation.yml'
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:

jobs:
  goreleaser-check:
    name: GoReleaser Check & Snapshot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'

      - name: Run GoReleaser Check
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: check

      - name: Run GoReleaser Snapshot Build
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --snapshot --clean --skip=publish,sign
