# dist-validation.yml — Automated GoReleaser Dry-Run & Packaging Validation Gate
name: Dist Validation

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  goreleaser-check:
    name: GoReleaser Check & Snapshot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect CI Lane
        shell: bash
        run: |
          lane=$(bash tools/ci_lane_detect.sh origin/main || true)
          if [ "$lane" = "lane=docs" ] || [ "$lane" = "docs" ]; then
            CI_LANE="docs"
          else
            CI_LANE="build"
          fi
          echo "CI_LANE=$CI_LANE" >> "$GITHUB_ENV"
          export CI_LANE
          echo "Detected lane: $CI_LANE"

      - name: Early exit for docs lane
        shell: bash
        run: |
          if [ "${CI_LANE}" = "docs" ]; then
            echo "::notice::docs lane: GoReleaser Check & Snapshot skipped (not applicable)"
            exit 0
          fi

      - name: Setup Go
        if: env.CI_LANE != 'docs'
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      - name: Run GoReleaser Check
        if: env.CI_LANE != 'docs'
        uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: check

      - name: Run GoReleaser Snapshot Build
        if: env.CI_LANE != 'docs'
        uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --snapshot --clean --skip=publish,sign,nfpm

      - name: Validate Release Matrix
        if: env.CI_LANE != 'docs'
        run: bash tools/release_matrix_check.sh
