# dist-validation.yml — Automated GoReleaser Dry-Run & Packaging Validation Gate
name: Dist Validation

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  goreleaser-check:
    name: GoReleaser Check & Snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Detect CI Lane
        shell: bash
        run: |
          lane=$(bash tools/ci_lane_detect.sh origin/main || true)
          if [ "$lane" = "lane=docs" ] || [ "$lane" = "docs" ]; then
            CI_LANE="docs"
          else
            CI_LANE="build"
          fi
          echo "CI_LANE=$CI_LANE" >> "$GITHUB_ENV"
          export CI_LANE
          echo "Detected lane: $CI_LANE"

      - name: Early exit for docs lane
        shell: bash
        run: |
          if [ "${CI_LANE}" = "docs" ]; then
            echo "::notice::docs lane: GoReleaser Check & Snapshot skipped (not applicable)"
            exit 0
          fi

      - name: Setup Go
        if: env.CI_LANE != 'docs'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.11'

      - name: Run GoReleaser Check
        if: env.CI_LANE != 'docs'
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          version: v2.20.3
          args: check

      - name: Install Syft (pinned + SHA-256 verified, #983)
        if: env.CI_LANE != 'docs'
        env:
          SYFT_VERSION: '1.57.2'
          SYFT_SHA256: 'ad92bd3ec1b94a3df01d4d0aec199afa9c42b72e86da436ff5f837914d32706b'
        run: |
          set -euo pipefail
          # Pinned release tarball + embedded SHA-256 (cross-checked against
          # syft_1.57.2_checksums.txt from the anchore/syft v1.57.2 release).
          # Replaces the former `curl | sh` of the unpinned @main install script.
          # shellcheck source=tools/ci_fetch.sh
          source tools/ci_fetch.sh
          SYFT_URL="https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          SYFT_TGZ="${RUNNER_TEMP}/syft_${SYFT_VERSION}.tar.gz"
          ci_fetch "$SYFT_URL" "$SYFT_TGZ" "$SYFT_SHA256"
          mkdir -p "${RUNNER_TEMP}/bin"
          tar -xzf "$SYFT_TGZ" -C "${RUNNER_TEMP}/bin" syft
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/bin/syft" version

      - name: Run GoReleaser Snapshot Build
        if: env.CI_LANE != 'docs'
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          version: v2.20.3
          args: release --snapshot --clean --skip=publish,sign,nfpm

      - name: Validate Release Matrix
        if: env.CI_LANE != 'docs'
        run: bash tools/release_matrix_check.sh
