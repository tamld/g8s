# Release automation for g8s.
#
# Triggered by annotated SemVer tag pushes (e.g. v0.1.0, v0.2.0-rc.1).
# Verifies the tag matches the Version constant baked into cmd/g8s/version.go,
# runs the full build + test suite, then publishes cross-platform archives
# and a GitHub Release via GoReleaser.
#
# Conventions adopted from the defense-in-depth sibling project's
# release workflow (tag-triggered, version assertion, fail-closed).

name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tag and run full test suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.11'

      - name: Assert tag matches source version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          TAG_VERSION="${TAG_NAME#v}"
          SRC_VERSION="$(grep -oE 'Version[[:space:]]*=[[:space:]]*"[^"]*"' cmd/g8s/version.go | head -n1 | cut -d'"' -f2)"
          echo "tag version : ${TAG_VERSION}"
          echo "src  version: ${SRC_VERSION}"
          if [ "${TAG_VERSION}" != "${SRC_VERSION}" ]; then
            echo "::error::Tag ${TAG_NAME} does not match cmd/g8s/version.go Version '${SRC_VERSION}'."
            exit 1
          fi

      - name: Check formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "::error::The following files are not gofmt'd:"
            gofmt -l .
            exit 1
          fi

      - name: Vet (Zero-CGO)
        env:
          CGO_ENABLED: '0'
        run: go vet ./...

      - name: Test plain build (Zero-CGO)
        env:
          CGO_ENABLED: '0'
        run: go test -count=1 ./...

      - name: Test race detector
        env:
          CGO_ENABLED: '1'
        run: go test -race -count=1 ./internal/...

      - name: Build smoke (all packages, including cmd/g8s which has no tests)
        env:
          CGO_ENABLED: '0'
        run: go build ./...

  build-darwin:
    name: Build darwin/amd64 + darwin/arm64 archives
    runs-on: macos-latest
    needs: verify
    env:
      CGO_ENABLED: '0'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.11'

      - name: Build darwin binaries
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            GOOS=darwin GOARCH=${arch} go build -ldflags="-s -w -X main.Version=${GITHUB_REF_NAME#v} -X main.Commit=${GITHUB_SHA} -X main.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" -o dist/g8s-darwin-${arch} ./cmd/g8s
            (cd dist && zip g8s-darwin-${arch}.zip g8s-darwin-${arch})
          done

      - name: Upload darwin artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: g8s-darwin
          path: dist/*.zip
          retention-days: 7

  build-windows:
    name: Build windows/amd64 + windows/arm64 archives
    runs-on: windows-latest
    needs: verify
    env:
      CGO_ENABLED: '0'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.11'

      - name: Build windows binaries
        shell: bash
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            GOOS=windows GOARCH=${arch} go build -ldflags="-s -w -X main.Version=${GITHUB_REF_NAME#v} -X main.Commit=${GITHUB_SHA} -X main.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" -o dist/g8s-windows-${arch}.exe ./cmd/g8s
            # Windows runner ships tar.exe (Windows 10 1803+/Server 2019+) — use it
            # instead of `zip` which is not preinstalled on windows-latest images.
            # tar.gz is the dominant Windows distribution format alongside .zip.
            (cd dist && tar -czf g8s-windows-${arch}.tar.gz g8s-windows-${arch}.exe)
          done

      - name: Upload windows artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: g8s-windows
          path: dist/*.tar.gz
          retention-days: 7

  publish:
    name: Publish GitHub Release with Linux archives
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.11'

      - name: Install Syft for SBOM generation
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sudo sh -s -- -b /usr/local/bin
          syft --version

      - name: Install Cosign for keyless checksum signing
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Publish release via GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          distribution: goreleaser
          version: '~> v2.10'
          args: release --clean --skip=homebrew
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      - name: Attest release checksums (SLSA Build L2 provenance)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: ./dist/checksums.txt

  notarize-macos:
    # DISABLED 2026-09-05: Apple Developer account resource not available.
    # Re-enable by removing the `if: false` guard and supplying APPLE_ID,
    # APPLE_PASSWORD, APPLE_TEAM_ID secrets. macOS darwin binaries still
    # build + ship unsigned via build-darwin + publish jobs.
    name: Notarize macOS binaries (DISABLED — no Apple Dev account)
    runs-on: macos-latest
    needs: build-darwin
    if: false
    steps:
      - name: Download darwin artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: g8s-darwin

      - name: Notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool store-credentials \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID"
          for f in *.zip; do
            ditto -xk --keepparent "$f" extracted
            xcrun notarytool submit extracted/g8s-darwin-* \
              --keychain-profile "notarytool-profile" \
              --wait
            xcrun stapler staple extracted/g8s-darwin-*
            ditto -c --keepparent extracted "${f%.zip}-notarized.zip"
            rm -rf extracted
          done
          mv *-notarized.zip g8s-darwin-notarized.zip

      - name: Upload notarized artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: g8s-darwin-notarized
          path: g8s-darwin-notarized.zip
          retention-days: 7
