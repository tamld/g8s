# Release automation for g8s.
#
# Triggered by annotated SemVer tag pushes (e.g. v0.1.0, v0.2.0-rc.1).
# Verifies the tag matches the Version constant baked into cmd/g8s/main.go,
# runs the full build + test suite, then publishes cross-platform archives
# and a GitHub Release via GoReleaser.
#
# Conventions adopted from the defense-in-depth sibling project's
# release workflow (tag-triggered, version assertion, fail-closed).

name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, verify, and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'

      - name: Assert tag matches source version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          TAG_VERSION="${TAG_NAME#v}"
          SRC_VERSION="$(grep -o 'Version = "[^"]*"' cmd/g8s/version.go | cut -d'"' -f2)"
          echo "tag version : ${TAG_VERSION}"
          echo "src  version: ${SRC_VERSION}"
          if [ "${TAG_VERSION}" != "${SRC_VERSION}" ]; then
            echo "::error::Tag ${TAG_NAME} does not match cmd/g8s/version.go Version '${SRC_VERSION}'."
            exit 1
          fi

      - name: Build all packages
        run: go build ./...

      - name: Run test suite
        run: go test -count=1 ./...

      - name: Run race detector on internal packages
        run: go test -race -count=1 ./internal/...

      - name: Publish release via GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2.10'
          args: release --clean --skip=homebrew
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      - name: Sign Windows binaries
        if: matrix.goos == 'windows-latest' && env.HAS_CERT == 'true'
        shell: pwsh
        run: |
          signtool sign /tr http://timestamp.digicert.com /td sha256 /fd sha256 /a /f ${{ env.CERT_PATH }} ./dist/*.exe
          signtool verify /pa ./dist/*.exe

      - name: Skip signing (no cert)
        if: matrix.goos == 'windows-latest' && env.HAS_CERT != 'true'
        run: echo "No signing cert available; skipping"

  notarize-macos:
    runs-on: macos-latest
    needs: build-darwin
    if: ${{ env.APPLE_ID != '' }}
    steps:
      - uses: actions/checkout@v5
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: g8s-darwin
      - name: Notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool store-credentials \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID"
          for f in *.zip; do
            ditto -xk --keepparent "$f" extracted
            xcrun notarytool submit extracted/g8s \
              --keychain-profile "notarytool-profile" \
              --wait
            xcrun stapler staple extracted/g8s
            ditto -c --keepparent extracted "${f%.zip}-notarized.zip"
            rm -rf extracted
          done
          mv *-notarized.zip g8s-darwin-notarized.zip
      - uses: actions/upload-artifact@v5
        with:
          name: g8s-darwin-notarized
          path: g8s-darwin-notarized.zip


