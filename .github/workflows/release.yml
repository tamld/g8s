# Release automation for g8s.
#
# Triggered by annotated SemVer tag pushes (e.g. v0.1.0, v0.2.0-rc.1).
# Verifies the tag matches the Version constant baked into cmd/g8s/version.go,
# runs the full build + test suite, then publishes cross-platform archives
# and a GitHub Release via GoReleaser.
#
# Conventions adopted from the defense-in-depth sibling project's
# release workflow (tag-triggered, version assertion, fail-closed).

name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
    branches-ignore:
      - '**'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tag and run full test suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'

      - name: Assert tag matches source version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          TAG_VERSION="${TAG_NAME#v}"
          SRC_VERSION="$(grep -o 'Version = "[^"]*"' cmd/g8s/version.go | cut -d'"' -f2)"
          echo "tag version : ${TAG_VERSION}"
          echo "src  version: ${SRC_VERSION}"
          if [ "${TAG_VERSION}" != "${SRC_VERSION}" ]]; then
            echo "::error::Tag ${TAG_NAME} does not match cmd/g8s/version.go Version '${SRC_VERSION}'."
            exit 1
          fi

      - name: Check formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "::error::The following files are not gofmt'd:"
            gofmt -l .
            exit 1
          fi

      - name: Vet (Zero-CGO)
        env:
          CGO_ENABLED: '0'
        run: go vet ./...

      - name: Test plain build (Zero-CGO)
        env:
          CGO_ENABLED: '0'
        run: go test -count=1 ./...

      - name: Test race detector
        env:
          CGO_ENABLED: '1'
        run: go test -race -count=1 ./internal/...

      - name: Build smoke (all packages, including cmd/g8s which has no tests)
        env:
          CGO_ENABLED: '0'
        run: go build ./...

  build-darwin:
    name: Build darwin/amd64 + darwin/arm64 archives
    runs-on: macos-latest
    needs: verify
    env:
      CGO_ENABLED: '0'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'

      - name: Build darwin binaries
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            GOOS=darwin GOARCH=${arch} go build -ldflags="-s -w -X main.Version=${GITHUB_REF_NAME#v} -X main.Commit=${GITHUB_SHA} -X main.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" -o dist/g8s-darwin-${arch} ./cmd/g8s
            (cd dist && zip g8s-darwin-${arch}.zip g8s-darwin-${arch})
          done

      - name: Upload darwin artifacts
        uses: actions/upload-artifact@v7
        with:
          name: g8s-darwin
          path: dist/*.zip
          retention-days: 7

  build-windows:
    name: Build windows/amd64 + windows/arm64 archives
    runs-on: windows-latest
    needs: verify
    env:
      CGO_ENABLED: '0'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'

      - name: Build windows binaries
        shell: bash
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            GOOS=windows GOARCH=${arch} go build -ldflags="-s -w -X main.Version=${GITHUB_REF_NAME#v} -X main.Commit=${GITHUB_SHA} -X main.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" -o dist/g8s-windows-${arch}.exe ./cmd/g8s
            (cd dist && zip g8s-windows-${arch}.zip g8s-windows-${arch}.exe)
          done

      - name: Upload windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: g8s-windows
          path: dist/*.zip
          retention-days: 7

  publish:
    name: Publish GitHub Release with Linux archives
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'

      - name: Publish release via GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2.10'
          args: release --clean --skip=homebrew
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

  notarize-macos:
    name: Notarize macOS binaries (Apple ID required)
    runs-on: macos-latest
    needs: build-darwin
    if: ${{ env.APPLE_ID != '' }}
    steps:
      - name: Download darwin artifacts
        uses: actions/download-artifact@v7
        with:
          name: g8s-darwin

      - name: Notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool store-credentials \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID"
          for f in *.zip; do
            ditto -xk --keepparent "$f" extracted
            xcrun notarytool submit extracted/g8s-darwin-* \
              --keychain-profile "notarytool-profile" \
              --wait
            xcrun stapler staple extracted/g8s-darwin-*
            ditto -c --keepparent extracted "${f%.zip}-notarized.zip"
            rm -rf extracted
          done
          mv *-notarized.zip g8s-darwin-notarized.zip

      - name: Upload notarized artifacts
        uses: actions/upload-artifact@v7
        with:
          name: g8s-darwin-notarized
          path: g8s-darwin-notarized.zip
          retention-days: 7
