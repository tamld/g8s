# Release automation for g8s.
#
# Triggered by annotated SemVer tag pushes (e.g. v0.1.0, v0.2.0-rc.1).
# Verifies the tag matches the Version constant baked into cmd/g8s/version.go,
# runs the full build + test suite, then publishes cross-platform archives
# and a GitHub Release via GoReleaser.
#
# Conventions adopted from the defense-in-depth sibling project's
# release workflow (tag-triggered, version assertion, fail-closed).

name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tag and run full test suite
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # H-02 (audit): a release tag must point at a commit that is part of
      # the approved main history — a tag pushed from a side branch or an
      # ad-hoc commit must never reach verify/build/publish.
      - name: Verify release commit is on main
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::Release commit ${GITHUB_SHA} is not an ancestor of origin/main — release refuses (audit H-02)"
            exit 1
          fi
          echo "release commit ${GITHUB_SHA} is on main: verified"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.11'

      - name: Assert tag matches source version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          TAG_VERSION="${TAG_NAME#v}"
          SRC_VERSION="$(grep -oE 'Version[[:space:]]*=[[:space:]]*"[^"]*"' cmd/g8s/version.go | head -n1 | cut -d'"' -f2)"
          echo "tag version : ${TAG_VERSION}"
          echo "src  version: ${SRC_VERSION}"
          if [ "${TAG_VERSION}" != "${SRC_VERSION}" ]; then
            echo "::error::Tag ${TAG_NAME} does not match cmd/g8s/version.go Version '${SRC_VERSION}'."
            exit 1
          fi

      - name: Check formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "::error::The following files are not gofmt'd:"
            gofmt -l .
            exit 1
          fi

      - name: Vet (Zero-CGO)
        env:
          CGO_ENABLED: '0'
        run: go vet ./...

      - name: Test plain build (Zero-CGO)
        env:
          CGO_ENABLED: '0'
        run: go test -count=1 ./...

      - name: Test race detector
        env:
          CGO_ENABLED: '1'
        run: go test -race -count=1 ./internal/...

      - name: Build smoke (all packages, including cmd/g8s which has no tests)
        env:
          CGO_ENABLED: '0'
        run: go build ./...

      - name: Verify Linux release binary TRUST Assurance Status (#959)
        env:
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          VERIFY_DIR="$(mktemp -d)"
          VERIFY_BIN="${VERIFY_DIR}/g8s"
          go build -ldflags="-s -w -X main.Version=${GITHUB_REF_NAME#v} -X main.Commit=${GITHUB_SHA} -X main.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ) -X main.BuildSource=release" -o "$VERIFY_BIN" ./cmd/g8s
          ASSURE_JSON="$(bash tools/assurance_benchmark.sh --bin "$VERIFY_BIN" --verify-binary-commit "$GITHUB_SHA" --require-clean-vcs --json)"
          printf '%s\n' "$ASSURE_JSON" | jq -e '
            .score == 1 and
            .failed_probes == 0 and
            .passed_probes == 5 and
            .trust_assurance_status.schema == "g8s.trust-assurance/v1" and
            .trust_assurance_status.binary_matches_source == true and
            .trust_assurance_status.vcs_modified == false and
            .trust_assurance_status.non_compensatory_veto == false and
            (.trust_assurance_status.gates | length == 6)
          ' > /dev/null
          printf '%s\n' "$ASSURE_JSON" > "${RUNNER_TEMP}/trust-assurance-linux.json"
          bash tools/assurance_benchmark.sh --bin "$VERIFY_BIN" --verify-binary-commit "$GITHUB_SHA" --require-clean-vcs --markdown
          rm -rf "$VERIFY_DIR"

      - name: Upload Linux TRUST Assurance artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: trust-assurance-linux
          path: ${{ runner.temp }}/trust-assurance-linux.json
          retention-days: 7

  build-darwin:
    name: Build darwin/amd64 + darwin/arm64 archives
    runs-on: macos-latest
    needs: verify
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CGO_ENABLED: '0'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.11'

      - name: Build darwin binaries
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            GOOS=darwin GOARCH=${arch} go build -ldflags="-s -w -X main.Version=${GITHUB_REF_NAME#v} -X main.Commit=${GITHUB_SHA} -X main.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ) -X main.BuildSource=release" -o dist/g8s-darwin-${arch} ./cmd/g8s
            (cd dist && zip g8s-darwin-${arch}.zip g8s-darwin-${arch})
          done

      - name: Verify darwin binary TRUST Assurance Status (#959)
        run: |
          set -euo pipefail
          HOST_ARCH="$(go env GOARCH | tr -d '\r')"
          ASSURE_JSON="$(bash tools/assurance_benchmark.sh --bin "dist/g8s-darwin-${HOST_ARCH}" --verify-binary-commit "$GITHUB_SHA" --require-clean-vcs --require-kernel-enforced --json)"
          printf '%s\n' "$ASSURE_JSON" | jq -e '
            .score == 1 and
            .failed_probes == 0 and
            .passed_probes == 5 and
            .trust_assurance_status.schema == "g8s.trust-assurance/v1" and
            .trust_assurance_status.binary_matches_source == true and
            .trust_assurance_status.vcs_modified == false and
            .trust_assurance_status.non_compensatory_veto == false and
            .trust_assurance_status.overall_verdict == "ENFORCED" and
            (.trust_assurance_status.gates | length == 6)
          ' > /dev/null
          printf '%s\n' "$ASSURE_JSON" > "${RUNNER_TEMP}/trust-assurance-darwin-${HOST_ARCH}.json"
          bash tools/assurance_benchmark.sh --bin "dist/g8s-darwin-${HOST_ARCH}" --verify-binary-commit "$GITHUB_SHA" --require-clean-vcs --require-kernel-enforced --markdown

      - name: Upload darwin artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: g8s-darwin
          path: dist/*.zip
          retention-days: 7

      - name: Upload darwin TRUST Assurance artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: trust-assurance-darwin
          path: ${{ runner.temp }}/trust-assurance-darwin-*.json
          retention-days: 7

  build-windows:
    name: Build windows/amd64 + windows/arm64 archives
    runs-on: windows-latest
    needs: verify
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CGO_ENABLED: '0'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.11'

      - name: Build windows binaries
        shell: bash
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            GOOS=windows GOARCH=${arch} go build -ldflags="-s -w -X main.Version=${GITHUB_REF_NAME#v} -X main.Commit=${GITHUB_SHA} -X main.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ) -X main.BuildSource=release" -o dist/g8s-windows-${arch}.exe ./cmd/g8s
            # Windows runner ships tar.exe (Windows 10 1803+/Server 2019+) — use it
            # instead of `zip` which is not preinstalled on windows-latest images.
            # tar.gz is the dominant Windows distribution format alongside .zip.
            (cd dist && tar -czf g8s-windows-${arch}.tar.gz g8s-windows-${arch}.exe)
          done

      - name: Verify windows binary TRUST Assurance Status (#959)
        shell: bash
        run: |
          set -euo pipefail
          HOST_ARCH="$(go env GOARCH | tr -d '\r')"
          ASSURE_JSON="$(bash tools/assurance_benchmark.sh --bin "dist/g8s-windows-${HOST_ARCH}.exe" --verify-binary-commit "$GITHUB_SHA" --require-clean-vcs --json)"
          printf '%s\n' "$ASSURE_JSON" | jq -e '
            .score == 1 and
            .failed_probes == 0 and
            .passed_probes == 5 and
            .trust_assurance_status.schema == "g8s.trust-assurance/v1" and
            .trust_assurance_status.binary_matches_source == true and
            .trust_assurance_status.vcs_modified == false and
            .trust_assurance_status.non_compensatory_veto == false and
            .trust_assurance_status.overall_verdict == "MEDIATED_ONLY" and
            (.trust_assurance_status.gates | length == 6)
          ' > /dev/null
          printf '%s\n' "$ASSURE_JSON" > "${RUNNER_TEMP}/trust-assurance-windows-${HOST_ARCH}.json"
          bash tools/assurance_benchmark.sh --bin "dist/g8s-windows-${HOST_ARCH}.exe" --verify-binary-commit "$GITHUB_SHA" --require-clean-vcs --markdown

      - name: Upload windows artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: g8s-windows
          path: dist/*.tar.gz
          retention-days: 7

      - name: Upload windows TRUST Assurance artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: trust-assurance-windows
          path: ${{ runner.temp }}/trust-assurance-windows-*.json
          retention-days: 7

  publish:
    name: Publish GitHub Release with Linux archives
    runs-on: ubuntu-latest
    needs: [verify, build-darwin, build-windows]
    timeout-minutes: 40
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.11'

      - name: Install Syft for SBOM generation (pinned + SHA-256 verified, #983)
        env:
          SYFT_VERSION: '1.57.2'
          SYFT_SHA256: 'ad92bd3ec1b94a3df01d4d0aec199afa9c42b72e86da436ff5f837914d32706b'
        run: |
          set -euo pipefail
          # Pinned release tarball + embedded SHA-256 (cross-checked against
          # syft_1.57.2_checksums.txt from the anchore/syft v1.57.2 release).
          # Replaces the former `curl | sudo sh` of the unpinned @main install
          # script; installs into the runner temp dir — no root, no pipe-to-shell.
          # shellcheck source=tools/ci_fetch.sh
          source tools/ci_fetch.sh
          SYFT_URL="https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          SYFT_TGZ="${RUNNER_TEMP}/syft_${SYFT_VERSION}.tar.gz"
          ci_fetch "$SYFT_URL" "$SYFT_TGZ" "$SYFT_SHA256"
          mkdir -p "${RUNNER_TEMP}/bin"
          tar -xzf "$SYFT_TGZ" -C "${RUNNER_TEMP}/bin" syft
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/bin/syft" version

      - name: Install Cosign for keyless checksum signing
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      # M-02 (external audit) / #1022: GoReleaser creates the release as a
      # DRAFT — nothing is user-visible yet. The artifact validation gate runs
      # BEFORE the draft is flipped public, so a tampered/missing/corrupted
      # dist artifact fails the job and the release stays unpublished
      # (fail-closed). The cosign bundle signs checksums.txt, whose entries the
      # gate re-verifies against the actual dist/, and the SLSA attestation
      # step below covers the same validated checksums.txt.
      - name: Prepare release via GoReleaser as draft (#1022 gate boundary)
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          distribution: goreleaser
          version: v2.20.3
          args: release --clean --skip=homebrew --draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      # M-02 / #1022: post-build artifact validation gate — binds the artifacts
      # that are about to be published to the verified build:
      #   1. dist/ contains the exact platform-matrix archive set derived from
      #      .goreleaser.yaml (darwin_all universal, linux amd64/arm64,
      #      windows amd64/arm64 zips) — and nothing unexpected,
      #   2. every checksums.txt entry matches a freshly re-computed SHA-256,
      #   3. every archived binary embeds main.Version == the release tag
      #      (ldflags read via `go version -m`; the linux/amd64 binary is also
      #      executed on this runner).
      # Any mismatch/absence exits non-zero with a typed [E_*] error — the
      # draft release is never flipped public.
      - name: Validate dist artifacts before publish (#1022)
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          bash tools/artifact_validate.sh --dist dist --tag "${TAG_NAME}" --config .goreleaser.yaml

      # Only reached when the gate passed: flip the validated draft release
      # public. Its assets were uploaded by GoReleaser from the exact dist/
      # the gate just validated.
      - name: Publish validated draft release (#1022)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! gh release view "${TAG_NAME}" --json isDraft >/dev/null 2>&1; then
            echo "::error::[E_RELEASE_MISSING] draft release ${TAG_NAME} not found — GoReleaser prepare step failed"
            exit 1
          fi
          ASSET_COUNT="$(gh release view "${TAG_NAME}" --json assets --jq '.assets | length')"
          if [ "${ASSET_COUNT}" -eq 0 ]; then
            echo "::error::[E_RELEASE_NO_ASSETS] draft release ${TAG_NAME} has no assets — refusing to publish"
            exit 1
          fi
          echo "draft release ${TAG_NAME} validated with ${ASSET_COUNT} assets — publishing"
          gh release edit "${TAG_NAME}" --draft=false

      - name: Attest release checksums (SLSA Build L2 provenance)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: ./dist/checksums.txt

  notarize-macos:
    # DISABLED 2026-09-05: Apple Developer account resource not available.
    # Re-enable by removing the `if: false` guard and supplying APPLE_ID,
    # APPLE_PASSWORD, APPLE_TEAM_ID secrets. macOS darwin binaries still
    # build + ship unsigned via build-darwin + publish jobs.
    name: Notarize macOS binaries (DISABLED — no Apple Dev account)
    runs-on: macos-latest
    needs: build-darwin
    if: false
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Download darwin artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: g8s-darwin

      - name: Notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool store-credentials \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID"
          for f in *.zip; do
            ditto -xk --keepparent "$f" extracted
            xcrun notarytool submit extracted/g8s-darwin-* \
              --keychain-profile "notarytool-profile" \
              --wait
            xcrun stapler staple extracted/g8s-darwin-*
            ditto -c --keepparent extracted "${f%.zip}-notarized.zip"
            rm -rf extracted
          done
          mv *-notarized.zip g8s-darwin-notarized.zip

      - name: Upload notarized artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: g8s-darwin-notarized
          path: g8s-darwin-notarized.zip
          retention-days: 7
