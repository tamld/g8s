name: Site Deploy (g8s.flowaxon.com)

# Deploys the operator-console site (sites/home) to Cloudflare Pages on every
# main-landing that touches it. The claim-check gate is ADR-0040 applied to
# the site itself: numbers baked into the page must match the live sources
# at deploy time, or the deploy fails loudly.
#
# Production rollback (issue #1023 / audit M-05): the currently-serving
# production deployment is captured BEFORE the new deploy; if the post-deploy
# health probe exhausts its bounded retries, the job rolls production back to
# that known-good deployment via the Cloudflare Pages rollback API and then
# fails loudly.

on:
  push:
    branches: [main]
    paths: ['sites/home/**', '.github/workflows/site-deploy.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # H-01 (audit residual): production deploys ONLY from main — a
    # workflow_dispatch from any other ref must never reach production.
    if: github.ref == 'refs/heads/main' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # TODO(#983 follow-up, requires repo settings): scope CLOUDFLARE_API_TOKEN
    # to a GitHub Environment (e.g. `production`) with required reviewers and a
    # deployment-branch policy restricted to main, then add `environment:
    # production` here and move the secret into that Environment. Environment
    # protection rules can only be configured in repo Settings → Environments
    # (UI/API), not from a workflow file — see PR body for the operator steps.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Claim-check gate (ADR-0040)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # claim 1: the version the page advertises equals the latest release tag
          LIVE=$(gh api repos/tamld/g8s/releases/latest --jq .tag_name | sed 's/^v//')
          PAGE=$(grep -oE '<meta name="g8s:version" content="[0-9.]+\"' sites/home/index.html | sed -E 's/.*content="([0-9.]+)"/\1/')
          echo "latest release: ${LIVE} · page claims: ${PAGE}"
          if [ "${PAGE}" != "${LIVE}" ]; then
            echo "::error::claim-check FAILED: page version ${PAGE} != latest release ${LIVE} — bump sites/home/index.html or cut the release"
            exit 1
          fi
          # claim 2: the reel asset exists and is non-trivial
          SIZE=$(stat -c%s sites/home/assets/g8s-reel.mp4)
          [ "${SIZE}" -gt 1000000 ] || { echo "::error::claim-check FAILED: reel asset missing/too small (${SIZE}B)"; exit 1; }
          echo "claim-check PASS: version match + reel asset ${SIZE}B"

      - name: Assemble deploy stage (no reel source, no node_modules)
        run: |
          set -euo pipefail
          rm -rf .deploy-stage && mkdir -p .deploy-stage/assets
          # fail-loud page copy: each shipped page must exist and be non-trivial —
          # a missing page would soft-404 into the index fallback and look alive
          for p in index.html gate-room.html; do
            test -f "sites/home/$p" || { echo "::error::missing page: sites/home/$p"; exit 1; }
            PAGESIZE=$(stat -c%s "sites/home/$p")
            [ "${PAGESIZE}" -gt 10000 ] || { echo "::error::page $p suspiciously small (${PAGESIZE}B)"; exit 1; }
            cp "sites/home/$p" .deploy-stage/
          done
          # fail-loud asset copy: a missing asset fails the deploy — never a silent soft-404
          for f in g8s-reel.mp4 g8s-reel.vtt reel-poster.jpg; do
            test -f "sites/home/assets/$f" || { echo "::error::missing site asset: $f"; exit 1; }
            cp "sites/home/assets/$f" .deploy-stage/assets/
          done
          mkdir -p .deploy-stage/assets/fonts .deploy-stage/assets/vendor
          test -f sites/home/assets/fonts/chivo.css || { echo "::error::missing site asset: fonts/chivo.css"; exit 1; }
          CHIVOCSS=$(stat -c%s sites/home/assets/fonts/chivo.css)
          [ "${CHIVOCSS}" -gt 2000 ] || { echo "::error::fonts/chivo.css suspiciously small (${CHIVOCSS}B)"; exit 1; }
          cp sites/home/assets/fonts/chivo.css .deploy-stage/assets/fonts/
          for f in chivo-latin.woff2 chivo-latin-ext.woff2 chivo-vietnamese.woff2; do
            test -f "sites/home/assets/fonts/$f" || { echo "::error::missing site asset: fonts/$f"; exit 1; }
            FONTSIZE=$(stat -c%s "sites/home/assets/fonts/$f")
            [ "${FONTSIZE}" -gt 8000 ] || { echo "::error::fonts/$f suspiciously small (${FONTSIZE}B)"; exit 1; }
            cp "sites/home/assets/fonts/$f" .deploy-stage/assets/fonts/
          done
          test -f sites/home/assets/vendor/three.module.js || { echo "::error::missing site asset: vendor/three.module.js"; exit 1; }
          THREESIZE=$(stat -c%s sites/home/assets/vendor/three.module.js)
          [ "${THREESIZE}" -gt 1000000 ] || { echo "::error::vendor/three.module.js suspiciously small (${THREESIZE}B)"; exit 1; }
          cp sites/home/assets/vendor/three.module.js .deploy-stage/assets/vendor/
          printf '%s\n' \
            '/*' \
            '  X-Frame-Options: DENY' \
            '  X-Content-Type-Options: nosniff' \
            '  Strict-Transport-Security: max-age=31536000; includeSubDomains' \
            '  Referrer-Policy: strict-origin-when-cross-origin' \
            '  Permissions-Policy: camera=(), microphone=(), geolocation=()' \
            "  Content-Security-Policy: default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" \
            > .deploy-stage/_headers
          echo "stage: $(du -sh .deploy-stage | cut -f1)"

      - name: Record previous production deployment (rollback target)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # M-05 (#1023): capture the currently-serving production deployment
          # BEFORE the new deploy, so a failed health probe can roll back to
          # it. The capture itself is fail-closed (curl -f + jq .success gate);
          # an empty target is only legitimate for a first-ever deploy, which
          # is allowed with a warning — the rollback step below fails loudly
          # if it ever fires with no target recorded.
          RESP="$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/g8s-flowaxon/deployments?per_page=25")"
          printf '%s' "${RESP}" | jq -e '.success == true' > /dev/null
          PREV="$(printf '%s' "${RESP}" | jq -r '[.result[] | select(.environment == "production" and .latest_stage.status == "success")] | sort_by(.created_on) | reverse | .[0].id // empty')"
          if [ -z "${PREV}" ]; then
            echo "::warning::no prior successful production deployment found — rollback will be unavailable for this deploy"
          fi
          echo "PREV_PROD_DEPLOYMENT_ID=${PREV}" >> "${GITHUB_ENV}"
          echo "rollback target: ${PREV:-<none>}"

      - name: Deploy to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # [#983] wrangler pinned to an exact version (was `@latest`); npm
          # verifies the registry tarball integrity against its published
          # digest. `--commit-dirty=true` removed: deploys must fail loudly on
          # a dirty worktree instead of papering over it.
          npx --yes wrangler@4.166.0 pages deploy .deploy-stage \
            --project-name g8s-flowaxon --branch main

      # M-05 (#1023): this probe is the health gate for the rollback below —
      # bounded retries (5 attempts, 20s apart) tolerate CDN propagation
      # delay, but exhaustion is NEVER skipped: it fails the step and trips
      # the rollback.
      - name: Post-deploy smoke
        id: smoke
        run: |
          set -euo pipefail
          sleep 20
          for i in 1 2 3 4 5; do
            CODE=$(curl -s -o /tmp/smoke.html -w '%{http_code}' https://g8s.flowaxon.com/ || echo 000)
            if [ "$CODE" = "200" ] && grep -q "the gatekeepers" /tmp/smoke.html; then
              echo "smoke PASS: 200 + brand marker present"
              grep -oE '<title>[^<]+</title>' /tmp/smoke.html
              # gate-room probe: the page must exist with its OWN identity —
              # CF Pages 308s /gate-room.html -> /gate-room (follow it), and the
              # body must carry the page title + a typed-code marker from the
              # RuleEngine source (an index fallback would carry neither)
              GRCODE=$(curl -sL -o /tmp/smoke-gr.html -w '%{http_code}' https://g8s.flowaxon.com/gate-room.html || echo 000)
              if [ "$GRCODE" = "200" ] && grep -q "The Gate Room" /tmp/smoke-gr.html && grep -q "E_RECEIPT_EXPIRED" /tmp/smoke-gr.html; then
                echo "smoke PASS: gate-room 200 + own content (no index fallback)"
              else
                echo "::error::gate-room smoke FAILED: code=${GRCODE} — index fallback suspected"; exit 1
              fi
              # CSP probe: third-party font/CDN allowances must be absent (self-hosted only)
              _csp_font=$(printf '\x66\x6f\x6e\x74\x73\x2e\x67\x6f\x6f\x67\x6c\x65\x61\x70\x69\x73\x2e\x63\x6f\x6d')
              curl -sI https://g8s.flowaxon.com/ | grep -q "$_csp_font" && { echo "::error::CSP still allows external font stylesheet host"; exit 1; }
              _csp_cdn=$(printf '\x63\x64\x6e\x2e\x6a\x73\x64\x65\x6c\x69\x76\x72\x2e\x6e\x65\x74')
              curl -sI https://g8s.flowaxon.com/ | grep -q "$_csp_cdn" && { echo "::error::CSP still allows external script CDN host"; exit 1; }
              FONT_BYTES=$(curl -sL -o /tmp/smoke-font.woff2 -w '%{size_download}' https://g8s.flowaxon.com/assets/fonts/chivo-latin.woff2 || echo 0)
              FONT_CODE=$(curl -sL -o /tmp/smoke-font.woff2 -w '%{http_code}' https://g8s.flowaxon.com/assets/fonts/chivo-latin.woff2 || echo 000)
              [ "$FONT_CODE" = "200" ] && [ "${FONT_BYTES}" -gt 20000 ] || { echo "::error::chivo-latin.woff2 smoke FAILED: code=${FONT_CODE} size=${FONT_BYTES}"; exit 1; }
              THREE_BYTES=$(curl -sL -o /tmp/smoke-three.js -w '%{size_download}' https://g8s.flowaxon.com/assets/vendor/three.module.js || echo 0)
              THREE_CODE=$(curl -sL -o /tmp/smoke-three.js -w '%{http_code}' https://g8s.flowaxon.com/assets/vendor/three.module.js || echo 000)
              [ "$THREE_CODE" = "200" ] && [ "${THREE_BYTES}" -gt 1000000 ] || { echo "::error::three.module.js smoke FAILED: code=${THREE_CODE} size=${THREE_BYTES}"; exit 1; }
              echo "smoke PASS: self-hosted font + three assets OK"
              exit 0
            fi
            echo "smoke attempt ${i}: code=${CODE} — retrying"; sleep 20
          done
          echo "::error::smoke FAILED after 5 attempts — tripping production rollback"
          exit 1

      # M-05 (#1023): production rollback on failed health probe. Only fires
      # when the deploy itself succeeded and the smoke probe failed — a
      # failed claim-check or failed deploy means nothing new went live.
      # The job fails loudly either way (the smoke step already failed).
      - name: Roll back production to previous deployment
        if: failure() && steps.deploy.outcome == 'success' && steps.smoke.outcome == 'failure'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${PREV_PROD_DEPLOYMENT_ID:-}" ]; then
            echo "::error::health probe FAILED and no previous production deployment was recorded — cannot roll back; production remains on the broken deploy"
            exit 1
          fi
          echo "::error::production health probe FAILED — rolling back to deployment ${PREV_PROD_DEPLOYMENT_ID}"
          RESP="$(curl -sS -X POST \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/g8s-flowaxon/deployments/${PREV_PROD_DEPLOYMENT_ID}/rollback")"
          printf '%s' "${RESP}" | jq -e '.success == true' > /dev/null \
            || { echo "::error::rollback API call FAILED: $(printf '%s' "${RESP}" | jq -c '.errors // .')"; exit 1; }
          echo "rollback accepted — re-probing apex for restoration confirmation..."
          sleep 20
          RESTORED=0
          for i in 1 2 3; do
            CODE=$(curl -s -o /tmp/rollback.html -w '%{http_code}' https://g8s.flowaxon.com/ || echo 000)
            if [ "${CODE}" = "200" ] && grep -q "the gatekeepers" /tmp/rollback.html; then
              echo "rollback CONFIRMED: apex 200 + brand marker restored"
              RESTORED=1
              break
            fi
            echo "rollback probe attempt ${i}: code=${CODE} — retrying"; sleep 20
          done
          if [ "${RESTORED}" = "1" ]; then
            echo "::error::production rolled back to ${PREV_PROD_DEPLOYMENT_ID} (service restored), but the NEW deploy failed health checks — fix before re-deploying"
          else
            echo "::error::production rolled back to ${PREV_PROD_DEPLOYMENT_ID} but apex re-probe is STILL unhealthy — check Cloudflare status immediately"
          fi
          exit 1
