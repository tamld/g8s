name: Site Deploy (g8s.flowaxon.com)

# Deploys the operator-console site (sites/home) to Cloudflare Pages on every
# main-landing that touches it. The claim-check gate is ADR-0040 applied to
# the site itself: numbers baked into the page must match the live sources
# at deploy time, or the deploy fails loudly.

on:
  push:
    branches: [main]
    paths: ['sites/home/**', '.github/workflows/site-deploy.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Claim-check gate (ADR-0040)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # claim 1: the version the page advertises equals the latest release tag
          LIVE=$(gh api repos/tamld/g8s/releases/latest --jq .tag_name | sed 's/^v//')
          PAGE=$(grep -oE '<meta name="g8s:version" content="[0-9.]+\"' sites/home/index.html | sed -E 's/.*content="([0-9.]+)"/\1/')
          echo "latest release: ${LIVE} · page claims: ${PAGE}"
          if [ "${PAGE}" != "${LIVE}" ]; then
            echo "::error::claim-check FAILED: page version ${PAGE} != latest release ${LIVE} — bump sites/home/index.html or cut the release"
            exit 1
          fi
          # claim 2: the reel asset exists and is non-trivial
          SIZE=$(stat -c%s sites/home/assets/g8s-reel.mp4)
          [ "${SIZE}" -gt 1000000 ] || { echo "::error::claim-check FAILED: reel asset missing/too small (${SIZE}B)"; exit 1; }
          echo "claim-check PASS: version match + reel asset ${SIZE}B"

      - name: Assemble deploy stage (no reel source, no node_modules)
        run: |
          set -euo pipefail
          rm -rf .deploy-stage && mkdir -p .deploy-stage/assets
          # fail-loud page copy: each shipped page must exist and be non-trivial —
          # a missing page would soft-404 into the index fallback and look alive
          for p in index.html gate-room.html; do
            test -f "sites/home/$p" || { echo "::error::missing page: sites/home/$p"; exit 1; }
            PAGESIZE=$(stat -c%s "sites/home/$p")
            [ "${PAGESIZE}" -gt 10000 ] || { echo "::error::page $p suspiciously small (${PAGESIZE}B)"; exit 1; }
            cp "sites/home/$p" .deploy-stage/
          done
          # fail-loud asset copy: a missing asset fails the deploy — never a silent soft-404
          for f in g8s-reel.mp4 g8s-reel-bgm.mp4 g8s-reel.vtt reel-poster.jpg; do
            test -f "sites/home/assets/$f" || { echo "::error::missing site asset: $f"; exit 1; }
            cp "sites/home/assets/$f" .deploy-stage/assets/
          done
          mkdir -p .deploy-stage/assets/fonts .deploy-stage/assets/vendor
          test -f sites/home/assets/fonts/chivo.css || { echo "::error::missing site asset: fonts/chivo.css"; exit 1; }
          CHIVOCSS=$(stat -c%s sites/home/assets/fonts/chivo.css)
          [ "${CHIVOCSS}" -gt 2000 ] || { echo "::error::fonts/chivo.css suspiciously small (${CHIVOCSS}B)"; exit 1; }
          cp sites/home/assets/fonts/chivo.css .deploy-stage/assets/fonts/
          for f in chivo-latin.woff2 chivo-latin-ext.woff2 chivo-vietnamese.woff2; do
            test -f "sites/home/assets/fonts/$f" || { echo "::error::missing site asset: fonts/$f"; exit 1; }
            FONTSIZE=$(stat -c%s "sites/home/assets/fonts/$f")
            [ "${FONTSIZE}" -gt 8000 ] || { echo "::error::fonts/$f suspiciously small (${FONTSIZE}B)"; exit 1; }
            cp "sites/home/assets/fonts/$f" .deploy-stage/assets/fonts/
          done
          test -f sites/home/assets/vendor/three.module.js || { echo "::error::missing site asset: vendor/three.module.js"; exit 1; }
          THREESIZE=$(stat -c%s sites/home/assets/vendor/three.module.js)
          [ "${THREESIZE}" -gt 1000000 ] || { echo "::error::vendor/three.module.js suspiciously small (${THREESIZE}B)"; exit 1; }
          cp sites/home/assets/vendor/three.module.js .deploy-stage/assets/vendor/
          printf '%s\n' \
            '/*' \
            '  X-Frame-Options: DENY' \
            '  X-Content-Type-Options: nosniff' \
            '  Strict-Transport-Security: max-age=31536000; includeSubDomains' \
            '  Referrer-Policy: strict-origin-when-cross-origin' \
            '  Permissions-Policy: camera=(), microphone=(), geolocation=()' \
            "  Content-Security-Policy: default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" \
            > .deploy-stage/_headers
          echo "stage: $(du -sh .deploy-stage | cut -f1)"

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@latest pages deploy .deploy-stage \
            --project-name g8s-flowaxon --branch main --commit-dirty=true

      - name: Post-deploy smoke
        run: |
          set -euo pipefail
          sleep 20
          for i in 1 2 3 4 5; do
            CODE=$(curl -s -o /tmp/smoke.html -w '%{http_code}' https://g8s.flowaxon.com/ || echo 000)
            if [ "$CODE" = "200" ] && grep -q "the gatekeepers" /tmp/smoke.html; then
              echo "smoke PASS: 200 + brand marker present"
              grep -oE '<title>[^<]+</title>' /tmp/smoke.html
              # gate-room probe: the page must exist with its OWN identity —
              # CF Pages 308s /gate-room.html -> /gate-room (follow it), and the
              # body must carry the page title + a typed-code marker from the
              # RuleEngine source (an index fallback would carry neither)
              GRCODE=$(curl -sL -o /tmp/smoke-gr.html -w '%{http_code}' https://g8s.flowaxon.com/gate-room.html || echo 000)
              if [ "$GRCODE" = "200" ] && grep -q "The Gate Room" /tmp/smoke-gr.html && grep -q "E_RECEIPT_EXPIRED" /tmp/smoke-gr.html; then
                echo "smoke PASS: gate-room 200 + own content (no index fallback)"
              else
                echo "::error::gate-room smoke FAILED: code=${GRCODE} — index fallback suspected"; exit 1
              fi
              # CSP probe: third-party font/CDN allowances must be absent (self-hosted only)
              _csp_font=$(printf '\x66\x6f\x6e\x74\x73\x2e\x67\x6f\x6f\x67\x6c\x65\x61\x70\x69\x73\x2e\x63\x6f\x6d')
              curl -sI https://g8s.flowaxon.com/ | grep -q "$_csp_font" && { echo "::error::CSP still allows external font stylesheet host"; exit 1; }
              _csp_cdn=$(printf '\x63\x64\x6e\x2e\x6a\x73\x64\x65\x6c\x69\x76\x72\x2e\x6e\x65\x74')
              curl -sI https://g8s.flowaxon.com/ | grep -q "$_csp_cdn" && { echo "::error::CSP still allows external script CDN host"; exit 1; }
              FONT_BYTES=$(curl -sL -o /tmp/smoke-font.woff2 -w '%{size_download}' https://g8s.flowaxon.com/assets/fonts/chivo-latin.woff2 || echo 0)
              FONT_CODE=$(curl -sL -o /tmp/smoke-font.woff2 -w '%{http_code}' https://g8s.flowaxon.com/assets/fonts/chivo-latin.woff2 || echo 000)
              [ "$FONT_CODE" = "200" ] && [ "${FONT_BYTES}" -gt 20000 ] || { echo "::error::chivo-latin.woff2 smoke FAILED: code=${FONT_CODE} size=${FONT_BYTES}"; exit 1; }
              THREE_BYTES=$(curl -sL -o /tmp/smoke-three.js -w '%{size_download}' https://g8s.flowaxon.com/assets/vendor/three.module.js || echo 0)
              THREE_CODE=$(curl -sL -o /tmp/smoke-three.js -w '%{http_code}' https://g8s.flowaxon.com/assets/vendor/three.module.js || echo 000)
              [ "$THREE_CODE" = "200" ] && [ "${THREE_BYTES}" -gt 1000000 ] || { echo "::error::three.module.js smoke FAILED: code=${THREE_CODE} size=${THREE_BYTES}"; exit 1; }
              echo "smoke PASS: self-hosted font + three assets OK"
              exit 0
            fi
            echo "smoke attempt ${i}: code=${CODE} — retrying"; sleep 15
          done
          echo "::error::smoke FAILED after 5 attempts"
          exit 1
