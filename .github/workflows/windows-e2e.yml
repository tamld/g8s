name: Windows E2E

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Windows E2E Verification
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect CI Lane
        shell: bash
        run: |
          lane=$(bash tools/ci_lane_detect.sh origin/main || true)
          if [ "$lane" = "lane=docs" ] || [ "$lane" = "docs" ]; then
            CI_LANE="docs"
          else
            CI_LANE="build"
          fi
          echo "CI_LANE=$CI_LANE" >> "$GITHUB_ENV"
          export CI_LANE
          echo "Detected lane: $CI_LANE"

      - name: Early exit for docs lane
        shell: bash
        run: |
          if [ "${CI_LANE}" = "docs" ]; then
            echo "::notice::docs lane: Windows E2E Verification skipped (not applicable)"
            exit 0
          fi

      - name: Setup Go
        if: env.CI_LANE != 'docs'
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      - name: Build g8s binary
        if: env.CI_LANE != 'docs'
        run: go build -o g8s.exe ./cmd/g8s

      - name: Run Windows Test Suite
        if: env.CI_LANE != 'docs'
        run: go test -count=1 -tags=windows ./...
        env:
          CGO_ENABLED: '0'

      - name: Verify PATH and CLI Execution
        if: env.CI_LANE != 'docs'
        shell: pwsh
        run: |
          $installDir = "$env:LOCALAPPDATA\Programs\g8s\bin"
          New-Item -ItemType Directory -Force -Path $installDir | Out-Null
          Copy-Item -Path .\g8s.exe -Destination "$installDir\g8s.exe"
          $installDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          
          # Test execution
          .\g8s.exe version
          .\g8s.exe doctor
          .\g8s.exe cleanup --dry-run
          .\g8s.exe config get data_dir

          # Service management execution
          .\g8s.exe service status --json
          .\g8s.exe service install
          .\g8s.exe service status --json
          .\g8s.exe service uninstall

      - name: Upload Logs on Failure
        if: failure() && env.CI_LANE != 'docs'
        uses: actions/upload-artifact@v7
        with:
          name: windows-e2e-logs
          path: |
            *.log
            .cleanup-audit.jsonl
