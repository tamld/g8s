name: Windows E2E

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lane-gate:
    name: Docs lane scope
    runs-on: ubuntu-latest
    outputs:
      ci_lane: ${{ steps.detect.outputs.ci_lane }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect CI Lane
        id: detect
        shell: bash
        run: |
          BEFORE_SHA="${{ github.event.before }}"
          lane=$(bash tools/ci_lane_detect.sh origin/main "$BEFORE_SHA" || true)
          if [ "$lane" = "lane=docs" ] || [ "$lane" = "docs" ]; then
            CI_LANE="docs"
          else
            CI_LANE="build"
          fi
          echo "ci_lane=$CI_LANE" >> "$GITHUB_OUTPUT"
          echo "Detected lane: $CI_LANE"
          if [ "$CI_LANE" = "docs" ]; then
            echo "::notice::docs lane: Windows E2E Verification skipped (not applicable)"
          fi

  test:
    name: Windows E2E Verification
    needs: [lane-gate]
    if: needs.lane-gate.outputs.ci_lane != 'docs'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.10'

      - name: Build g8s binary
        run: go build -o g8s.exe ./cmd/g8s

      - name: Run Windows Test Suite
        run: go test -count=1 -tags=windows ./...
        env:
          CGO_ENABLED: '0'

      - name: Verify PATH and CLI Execution
        shell: pwsh
        run: |
          $installDir = "$env:LOCALAPPDATA\Programs\g8s\bin"
          New-Item -ItemType Directory -Force -Path $installDir | Out-Null
          Copy-Item -Path .\g8s.exe -Destination "$installDir\g8s.exe"
          $installDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          
          # Test execution
          .\g8s.exe version
          .\g8s.exe doctor
          .\g8s.exe cleanup --dry-run
          .\g8s.exe config get data_dir

          # Service management execution
          .\g8s.exe service status --json
          .\g8s.exe service install
          .\g8s.exe service status --json
          .\g8s.exe service uninstall

      - name: Upload Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: windows-e2e-logs
          path: |
            *.log
            .cleanup-audit.jsonl
