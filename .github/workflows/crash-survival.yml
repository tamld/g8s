name: Crash-Survival E2E

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lane-gate:
    name: Docs lane scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ci_lane: ${{ steps.detect.outputs.ci_lane }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Detect CI Lane
        id: detect
        shell: bash
        env:
          BASE_SHA: ${{ github.event.before }}
        run: |
          if ! lane=$(bash tools/ci_lane_detect.sh origin/main "$BASE_SHA" 2>/dev/null); then
            lane="build"
          fi
          if [ "$lane" = "lane=docs" ] || [ "$lane" = "docs" ]; then
            CI_LANE="docs"
          else
            CI_LANE="build"
          fi
          echo "ci_lane=$CI_LANE" >> "$GITHUB_OUTPUT"
          echo "Detected lane: $CI_LANE"
          if [ "$CI_LANE" = "docs" ]; then
            echo "::notice::docs lane: Crash-Survival E2E skipped (not applicable)"
          fi

  crash:
    name: 3-OS Fault-Injection & Sandbox (${{ matrix.os }})
    needs: [lane-gate]
    if: needs.lane-gate.outputs.ci_lane != 'docs'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.11'

      - name: Verify OS sandbox capability via doctor --json
        shell: bash
        run: |
          set -euo pipefail
          exe="./bin/g8s"
          if [ "${RUNNER_OS:-}" = "Windows" ]; then
            exe="./bin/g8s.exe"
          fi
          mkdir -p ./bin
          CGO_ENABLED=0 go build -o "$exe" ./cmd/g8s
          state_dir="$(mktemp -d)"
          trap 'rm -rf "$state_dir"' EXIT
          G8S_STATE_DIR="$state_dir" "$exe" doctor --json | tr -d '\r' | jq -e '.data.capabilities[] | select(.name == "os_sandbox") | (.available == true and .verification_state == "probed")'

      - name: Run 3-OS subprocess fault-injection E2E suite
        shell: bash
        run: |
          CGO_ENABLED=0 go test -v -count=1 -timeout 5m -run '^TestFaultInjectionE2E' ./cmd/g8s

  crash-gate:
    name: Crash-Survival Gate
    needs: [lane-gate, crash]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate Crash-Survival Status
        shell: bash
        env:
          LANE_RESULT: ${{ needs.lane-gate.result }}
          CRASH_RESULT: ${{ needs.crash.result }}
        run: |
          echo "lane-gate: ${LANE_RESULT}"
          echo "crash: ${CRASH_RESULT}"
          if [ "${LANE_RESULT}" != "success" ]; then
            echo "::error::Docs lane scope job failed (${LANE_RESULT})."
            exit 1
          fi
          if [ "${CRASH_RESULT}" != "success" ] && [ "${CRASH_RESULT}" != "skipped" ]; then
            echo "::error::Crash-Survival E2E failed (${CRASH_RESULT})."
            exit 1
          fi
          echo "Crash-Survival Gate PASSED."
