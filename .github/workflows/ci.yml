# g8s CI — Spec-Driven Development gate.
#
# Dual-pass testing strategy (see plans/M1-receipt-sprint-log.md deviation D4):
#   Pass 1 runs with CGO_ENABLED=0 to prove the Zero-CGO constitution axiom holds.
#   Pass 2 enables cgo solely because the Go race detector requires it;
#   the modernc.org/sqlite driver remains pure Go either way.

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'

      - name: Check formatting (gofmt)
        shell: bash
        run: |
          unformatted=$(gofmt -l . | grep -v '^reference/' || true)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet (Zero-CGO)
        run: go vet ./...
        env:
          CGO_ENABLED: '0'

      - name: Test plain build (Zero-CGO)
        run: go test -count=1 ./...
        env:
          CGO_ENABLED: '0'

      - name: Test race detector
        run: go test -race -count=1 ./internal/...
        env:
          CGO_ENABLED: '1'

      - name: Build smoke (all packages, including cmd/g8s which has no tests)
        run: go build ./...

      - name: Build Windows Installers (NSIS & WiX MSI)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          export PATH="/c/Program Files (x86)/NSIS:/c/Program Files/NSIS:/c/Program Files (x86)/WiX Toolset v3.11/bin:/c/Program Files/WiX Toolset v3.11/bin:$PATH"
          mkdir -p dist/windows_amd64
          go build -o dist/windows_amd64/g8s.exe ./cmd/g8s
          cp README.md LICENSE dist/windows_amd64/
          if command -v makensis &> /dev/null; then
            makensis -DVERSION=0.4.0 -DINPUT_DIR=dist/windows_amd64 packaging/windows/g8s.nsi
          elif [ -f "/c/Program Files (x86)/NSIS/makensis.exe" ]; then
            "/c/Program Files (x86)/NSIS/makensis.exe" -DVERSION=0.4.0 -DINPUT_DIR=dist/windows_amd64 packaging/windows/g8s.nsi
          elif [ -f "/c/Program Files/NSIS/makensis.exe" ]; then
            "/c/Program Files/NSIS/makensis.exe" -DVERSION=0.4.0 -DINPUT_DIR=dist/windows_amd64 packaging/windows/g8s.nsi
          fi
          if command -v candle &> /dev/null && command -v light &> /dev/null; then
            candle -dVersion=0.4.0 -dSourceDir=dist/windows_amd64 -out dist/g8s.wixobj packaging/windows/g8s.wxs
            light -out dist/g8s_0.4.0_windows_amd64.msi dist/g8s.wixobj
          fi

