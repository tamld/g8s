# g8s CI — Spec-Driven Development gate.
#
# Dual-pass testing strategy (see plans/M1-receipt-sprint-log.md deviation D4):
#   Pass 1 runs with CGO_ENABLED=0 to prove the Zero-CGO constitution axiom holds.
#   Pass 2 enables cgo solely because the Go race detector requires it;
#   the modernc.org/sqlite driver remains pure Go either way.

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect CI Lane
        shell: bash
        run: |
          BEFORE_SHA="${{ github.event.before }}"
          lane=$(bash tools/ci_lane_detect.sh origin/main "$BEFORE_SHA" || true)
          if [ "$lane" = "lane=docs" ] || [ "$lane" = "docs" ]; then
            CI_LANE="docs"
          else
            CI_LANE="build"
          fi
          echo "CI_LANE=$CI_LANE" >> "$GITHUB_ENV"
          export CI_LANE
          echo "Detected lane: $CI_LANE"

      - name: Early exit for docs lane
        shell: bash
        run: |
          if [ "${CI_LANE}" = "docs" ]; then
            echo "::notice::docs lane: Test ${{ matrix.os }} skipped (not applicable)"
            exit 0
          fi

      - name: Setup Go
        if: env.CI_LANE != 'docs'
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      - name: Check formatting (gofmt)
        if: env.CI_LANE != 'docs'
        shell: bash
        run: |
          unformatted=$(gofmt -l . | grep -v '^reference/' || true)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet (Zero-CGO)
        if: env.CI_LANE != 'docs'
        run: go vet ./...
        env:
          CGO_ENABLED: '0'

      - name: Test plain build (Zero-CGO)
        if: env.CI_LANE != 'docs'
        run: go test -count=1 ./...
        env:
          CGO_ENABLED: '0'

      - name: Test race detector
        if: env.CI_LANE != 'docs'
        run: go test -race -count=1 ./internal/...
        env:
          CGO_ENABLED: '1'

      - name: Build smoke (all packages, including cmd/g8s which has no tests)
        if: env.CI_LANE != 'docs'
        run: go build ./...

      - name: Dogfood self-test (g8s exercises itself)
        if: env.CI_LANE != 'docs'
        shell: bash
        run: |
          set -euo pipefail
          BIN="$(mktemp -d)/g8s"
          go build -o "$BIN" ./cmd/g8s
          # Exercise built binary without invoking a real worker. This catches:
          # binary entry-point regressions, subcommand routing breaks, and JSON
          # envelope contract drift that go test alone misses. Worker dispatch
          # (agy/9router) is intentionally NOT invoked here — those require
          # network access and live credentials which CI does not have.
          "$BIN" version --json >/dev/null
          "$BIN" --help >/dev/null

      - name: Build Windows Installers (NSIS & WiX MSI)
        if: env.CI_LANE != 'docs' && matrix.os == 'windows-latest'
        shell: bash
        run: |
          export PATH="/c/Program Files (x86)/NSIS:/c/Program Files/NSIS:/c/Program Files (x86)/WiX Toolset v3.11/bin:/c/Program Files/WiX Toolset v3.11/bin:$PATH"
          mkdir -p dist/windows_amd64
          go build -o dist/windows_amd64/g8s.exe ./cmd/g8s
          cp README.md LICENSE dist/windows_amd64/
          VERSION=$(go run ./cmd/g8s version --json | jq -r '.data.version // .version')
          if command -v makensis &> /dev/null; then
            makensis -DVERSION="$VERSION" -DINPUT_DIR=dist/windows_amd64 packaging/windows/g8s.nsi
          elif [ -f "/c/Program Files (x86)/NSIS/makensis.exe" ]; then
            "/c/Program Files (x86)/NSIS/makensis.exe" -DVERSION="$VERSION" -DINPUT_DIR=dist/windows_amd64 packaging/windows/g8s.nsi
          elif [ -f "/c/Program Files/NSIS/makensis.exe" ]; then
            "/c/Program Files/NSIS/makensis.exe" -DVERSION="$VERSION" -DINPUT_DIR=dist/windows_amd64 packaging/windows/g8s.nsi
          fi
          if command -v candle &> /dev/null && command -v light &> /dev/null; then
            candle -dVersion="$VERSION" -dSourceDir=dist/windows_amd64 -out dist/g8s.wixobj packaging/windows/g8s.wxs
            light -out "dist/g8s_${VERSION}_windows_amd64.msi" dist/g8s.wixobj
          fi

