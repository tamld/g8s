      - "go.sum"
    verify:
      - "docker run --rm -v $PWD:/workspace -w /workspace -v g8s-gomod:/go/pkg/mod -v g8s-gocache:/root/.cache/go-build -e CGO_ENABLED=0 --security-opt=no-new-privileges golang:1.25 sh -c 'gofmt -l . ; go vet ./... && go test -count=1 ./...'"
      - "docker run --rm -v $PWD:/workspace -w /workspace -v g8s-gomod:/go/pkg/mod -v g8s-gocache:/root/.cache/go-build -e CGO_ENABLED=1 --security-opt=no-new-privileges golang:1.25 sh -c 'go vet ./... && go test -race -count=1 ./...'"
      - "go build -o bin/g8s ./cmd/g8s"
      - "./bin/g8s orchestrate 'self-test' 2>&1 | tee /tmp/t020-selftest.log ; rc=${PIPESTATUS[0]} ; test $rc -ne 0 ; grep -c 'escalation' /tmp/t020-selftest.log ; grep -q 'approaches_tried\":3' /tmp/t020-selftest.log ; grep -q 'total_attempts\":9' /tmp/t020-selftest.log"
      - "go list -deps ./internal/supervisor | grep -E 'codex|agy|gemini|claude' | wc -l ; test $(go list -deps ./internal/supervisor | grep -E 'codex|agy|gemini|claude' | wc -l) -eq 0"
