# GoalBuddy v2 state.yaml
# Board truth lives here. goal.md is the editable charter; notes/ holds long receipts only.

version: 2

goal:
  title: "g8s MVP -> OSS Release (DELTA-02 onward)"
  slug: "g8s-mvp-oss"
  kind: existing_plan
  tranche: "Continuous execution: merge M1, stand up CI, port control plane (Phase 2), providers/MCP (Phase 3), service+CLI (Phase 4), parity+GoReleaser (Phase 5) until the oracle passes end to end; publishing is a separate owner-gated terminal card."
  status: done
  oracle:
    signal: "In Docker golang:1.25: CGO_ENABLED=0 go vet ./... && go test ./... fully green AND CGO_ENABLED=1 go test -race ./... green with zero reports AND total test count >= 140 AND goreleaser release --snapshot --clean succeeds producing cross-platform binaries"
    cadence: "after each Worker package and at final audit"
    final_proof: "receipts for every plan phase + oracle run output + final Judge audit mapping receipts to REFACTORING_PLAN phases with full_outcome_complete: true"
  intake:
    original_request: "'Em tự chạy, thiết kế trong goal — experiment: anh dựng khung, em tự chạy đến khi đạt goal, anh chờ kết quả cuối.' Prior directives: execute per self-defined goal with evidence logs; conditional OSS-public MIT at MVP; CI/CD cross-platform via public repo permitted; never harm files outside project scope."
    interpreted_outcome: "g8s reaches MVP per docs/REFACTORING_PLAN.md Phases 1-5 with CI in place and is publication-ready under MIT, awaiting only owner-gated publish."
    input_shape: existing_plan
    audience: "repo owner tamld (reviews final result only)"
    authority: approved
    proof_type: metric
    completion_proof: "full-suite dual-pass gate green with >=140 tests; goreleaser snapshot artifacts for linux/darwin/windows amd64/arm64; audit maps all receipts to plan phases"
    likely_misfire: "declaring victory after receipt engine alone; pushing/publishing before MVP gate; gold-plating control plane beyond its OpenSpec delta"
    blind_spots_considered:
      - "remote origin already exists (github.com/tamld/g8s) - visibility unverified"
      - "no GoReleaser config yet"
      - "host has no Go toolchain - all gates run in Docker golang:1.25 with g8s-gomod/g8s-gocache volumes"
      - "AGENTS.md literal exit criteria 'CGO_ENABLED=0 -race' unsatisfiable; dual-pass gate substitutes (D4, M1 sprint log)"
      - "parity target >=140 tests needs inventory against current count (~28 receipt + harness suite)"
    existing_plan_facts:
      - "Phase 1: harness DONE (internal/harness, DELTA-01 APPLIED)"
      - "DELTA-02 receipt DONE on feat/m1-receipt-engine (3 atomic commits, unmerged): engine + 28 tests, dual-pass gate green"
      - "Phase 2: control plane WAL queue + CAS leases + worker supervisor (spec/openspec DELTA-03 area)"
      - "Phase 3: providers + MCP server"
      - "Phase 4: kardianos service + cobra CLI"
      - "Phase 5: parity >= 140 tests + GoReleaser"
      - "Python baseline lives in reference/python/scripts/ (agy_control_plane.py, test_*.py)"

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  # OpenCode harness: dedicated GoalBuddy agent files are not installed here.
  # PM executes Scout/Judge/Worker roles directly and may delegate heavy
  # exploration/review to OpenCode subagents (task()) as needed.
  scout: missing
  worker: missing
  judge: missing

visual_board:
  # Owner waits for the final result only; file board suffices. Local live board skipped by delegated-authority default.
  selected: none
  local:
    status: not_requested
    url: null
    command: "node ~/.claude/skills/goal-prep/surfaces/local-goal-board/scripts/local-goal-board.mjs --goal docs/goals/g8s-mvp-oss"

active_task: null

tasks:
  - id: T001
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Validate the tranche plan against repo reality: merge safety of feat/m1-receipt-engine into main, ordering (CI before control plane?), slice sizing for Phases 2-5, and risks (origin visibility, missing GoReleaser config)."
    inputs:
      - "docs/REFACTORING_PLAN.md"
      - "manifest.json"
      - "plans/M1-receipt-sprint-log.md (in worktree feat-receipt-engine)"
      - "git branch state of main vs feat/m1-receipt-engine"
    constraints:
      - "Read-only. Do not implement or merge."
      - "Preserve owner plan facts; flag any deviation explicitly."
    expected_output:
      - "Decision on task order and merge strategy"
      - "Refined objectives, allowed_files, verify commands, stop_if for next Worker packages"
      - "Risks and mitigations"
