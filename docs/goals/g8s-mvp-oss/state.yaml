      worker_package:
        objective: "Merge feat/m1-receipt-engine into main and re-run oracle test subset to prove M1 landed green."
        allowed_files: []
        verify:
          - "git merge --no-ff feat/m1-receipt-engine"
          - "docker run --rm -v $(pwd):/workspace -w /workspace -v g8s-gomod:/go/pkg/mod -v g8s-gocache:/root/.cache/go-build -e CGO_ENABLED=0 --security-opt=no-new-privileges golang:1.25 sh -c 'go vet ./... && go test -count=1 ./...'"
        stop_if:
          - "Merge conflicts require semantic decisions beyond taking both sides cleanly."
          - "Oracle subset fails on main after merge."
      evidence:
        - .github/workflows/ci.yml
        - .goreleaser.yaml
        - "gh api repos/tamld/g8s -> {\"private\":true,\"visibility\":\"private\"}"
        - "git log --all -- .goreleaser.yaml .github/ -> eb5b14d initial commit"
  - id: T002
    type: worker
    assignee: Worker
    status: done
    reasoning_hint: default
    objective: "Merge feat/m1-receipt-engine into main and re-run the test portion of the oracle on main (vet + dual-pass tests)."
    allowed_files:
