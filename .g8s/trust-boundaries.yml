# Layer 3 / ADR-0024 Trust Boundaries Registry (#921)
# Paths matching these patterns represent critical security & trust surfaces
# (receipt/signing/charter verification, OS sandbox & process isolation,
# server auth surfaces, harness governance, memory poison surfaces, fsops/verifier/
# premise/conformance boundaries, and delivery).
# Tasks and PRs touching any of these paths route to Lane S (security).
trust_boundaries:
  - "internal/receipt/*"
  - "internal/worker/proc_*"
  - "internal/server/*"
  - "internal/harness/*"
  - "internal/memory/*"
  - "internal/dispatch/*"
  - "internal/sandbox/*"
  - "internal/signing/*"
  - "internal/charter/*"
  - "internal/fsops/*"
  - "internal/verifier/*"
  - "internal/premise/*"
  - "internal/provider/conformance/*"
  - "cmd/g8s/deliver.go"
