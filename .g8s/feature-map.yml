schema_version: "1.0"
# g8s Declarative End-to-End Feature Map (.g8s/feature-map.yml)
# Maps 14 single-responsibility functional feature nodes to SRS requirements,
# OpenSpec deltas, code paths, invariants, visible tests, verifier classes,
# and acyclic blast radius graphs.

features:
  - id: "FEAT-CONTROLPLANE-01"
    title: "Durable SQLite Control Plane & State Machine"
    persona_story: "As an autonomous agent, I need a durable SQLite WAL control plane with atomic CAS task transitions so that asynchronous workloads execute reliably across worker restarts."
    srs_reqs:
      - "FR-3"
      - "NFR-3"
    openspec_delta: "DELTA-03"
    code_paths:
      - "internal/controlplane/**"
      - "internal/state/**"
      - "internal/lockfile/**"
      - "internal/heartbeat/**"
    invariants:
      - "State transitions follow pure WAL SQLite state machine"
      - "Atomic CAS task claiming"
    visible_tests:
      - "internal/controlplane/store_test.go"
      - "internal/state/state_test.go"
    verifier_class: "test"
    blast_radius:
      depends_on: []
      direct_consumers:
        - "FEAT-WORKER-01"
        - "FEAT-VERIFY-01"
        - "FEAT-F0-GATE-01"
        - "FEAT-VAULT-MEMORY-01"
        - "FEAT-PLATFORM-CLI-01"

  - id: "FEAT-RECEIPT-01"
    title: "Path-Scoped Single-Use Write Receipts"
    persona_story: "As a security supervisor, I need single-use path-scoped write receipts so that worker mutations are cryptographically authorized and strictly confined to assigned paths."
    srs_reqs:
      - "FR-2"
    openspec_delta: "DELTA-02"
    code_paths:
      - "internal/receipt/**"
      - "internal/signing/**"
    invariants:
      - "Single-use consumption"
      - "Path scope enforcement"
    visible_tests:
      - "internal/receipt/receipt_test.go"
    verifier_class: "test"
    blast_radius:
      depends_on: []
      direct_consumers:
        - "FEAT-FSOPS-01"
        - "FEAT-WORKER-01"

  - id: "FEAT-FSOPS-01"
    title: "Pure-Go Native Cross-Platform Filesystem Agent I/O"
    persona_story: "As an autonomous agent, I need pure-Go cross-platform filesystem operations so that file mutations obey receipt bounds without relying on external host shell binaries."
    srs_reqs:
      - "FR-4"
      - "NFR-4"
    openspec_delta: "DELTA-23"
    code_paths:
      - "internal/fsops/**"
      - "internal/pathutil/**"
      - "internal/search/**"
    invariants:
      - "Pure Go with zero external shell dependencies"
      - "Receipt allowed_paths boundary enforcement"
    visible_tests:
      - "internal/fsops/fsops_test.go"
      - "internal/search/search_test.go"
    verifier_class: "test"
    blast_radius:
      depends_on:
        - "FEAT-RECEIPT-01"
      direct_consumers: []

  - id: "FEAT-WORKER-01"
    title: "Worker Process Execution & Capability Harness"
    persona_story: "As an execution harness, I need isolated process group supervision and credential redaction so that rogue subprocesses are cleanly reaped without leaking secrets."
    srs_reqs:
      - "FR-1"
      - "FR-4"
    openspec_delta: "DELTA-04"
    code_paths:
      - "internal/worker/**"
      - "internal/process/**"
      - "internal/harness/**"
      - "internal/dispatch/**"
      - "internal/hooks/**"
      - "internal/runtime/**"
      - "internal/sleep/**"
    invariants:
      - "Setpgid process group isolation"
      - "Sensitive token sanitization"
    visible_tests:
      - "internal/worker/worker_test.go"
      - "internal/process/lister_test.go"
    verifier_class: "test"
    blast_radius:
      depends_on:
        - "FEAT-CONTROLPLANE-01"
        - "FEAT-RECEIPT-01"
      direct_consumers:
        - "FEAT-LLMCALL-01"
        - "FEAT-VERIFY-01"
        - "FEAT-PLATFORM-CLI-01"

  - id: "FEAT-LLMCALL-01"
    title: "Universal Config-Driven LLM Consumer & Multi-Model Fleet"
    persona_story: "As a heterogeneous agent team, I need a provider-agnostic LLM call adapter supporting CLIProxyAPI, OpenRouter, OpenAI, Anthropic, and 9router so that tasks route cleanly without vendor lock-in."
    srs_reqs:
      - "FR-10"
    openspec_delta: "DELTA-25"
    code_paths:
      - "internal/provider/**"
      - "internal/config/**"
      - "internal/conv/**"
      - "internal/reflex/**"
      - "cmd/g8s/llm_call.go"
      - "offer/templates/providers.example.json"
    invariants:
      - "OpenAI, Anthropic, CLIProxyAPI, and 9router protocol conformance"
      - "DefaultModel resolution chain (--model -> entry.DefaultModel -> entry.Models[0].ID)"
      - "Two-layer public mechanism vs local policy separation"
    visible_tests:
      - "internal/provider/provider_test.go"
      - "internal/config/config_test.go"
      - "cmd/g8s/llm_call_test.go"
    verifier_class: "test"
    blast_radius:
      depends_on:
        - "FEAT-WORKER-01"
      direct_consumers:
        - "FEAT-ROUTING-LANE-01"
        - "FEAT-PLATFORM-CLI-01"

  - id: "FEAT-ROUTING-LANE-01"
    title: "Deterministic Effort-Class, Lane & Registry Routing"
    persona_story: "As a supervisor router, I need declarative effort-class and gate-lane routing so that task complexity maps deterministically to verifier classes and model effort budgets."
    srs_reqs:
      - "FR-5"
      - "FR-10"
    openspec_delta: "DELTA-05"
    code_paths:
      - "internal/routing/**"
      - "internal/lane/**"
      - "internal/registry/**"
      - "internal/settings/**"
    invariants:
      - "Deterministic effort-class and ALDC gate-lane routing"
      - "Seeded verifier and boundary registry validation"
    visible_tests:
      - "internal/registry/registry_test.go"
    verifier_class: "test"
    blast_radius:
      depends_on:
        - "FEAT-LLMCALL-01"
      direct_consumers:
        - "FEAT-PLATFORM-CLI-01"

  - id: "FEAT-VERIFY-01"
    title: "Worktree-Targeted Verification & Mechanical DoD Receipts"
    persona_story: "As a verification gate, I need worktree-targeted non-vacuous test execution and mechanically verified DoD matrices so that worker self-reports cannot bypass evidence checks."
    srs_reqs:
      - "FR-8"
    openspec_delta: "DELTA-21"
    code_paths:
      - "internal/verifier/**"
      - "internal/watch/**"
      - "internal/brief/**"
      - "internal/diffintel/**"
      - "internal/codeintel/**"
    invariants:
      - "Worktree-targeted non-vacuous test execution"
      - "EvaluateDoDMatrix rejects unverified worker self-report claims"
    visible_tests:
      - "internal/verifier/verifier_test.go"
    verifier_class: "test"
    blast_radius:
      depends_on:
        - "FEAT-CONTROLPLANE-01"
        - "FEAT-WORKER-01"
      direct_consumers:
        - "FEAT-BLIND-VERIFY-01"
        - "FEAT-F0-GATE-01"
        - "FEAT-PLATFORM-CLI-01"

  - id: "FEAT-BLIND-VERIFY-01"
    title: "3-Layer Anonymous / Blind Verification & Seeded Mutant Canary"
    persona_story: "As an epistemic audit harness, I need out-of-worktree holdout execution, double-blind sanitized review packets, and seeded mutant canary checks so that evaluation awareness and sycophancy are eliminated."
    srs_reqs:
      - "FR-8"
      - "FR-9"
    openspec_delta: "DELTA-21"
    code_paths:
      - "internal/verifier/blind_packet.go"
      - "internal/verifier/canary.go"
      - "cmd/g8s/verify.go"
      - "skills/**"
    invariants:
      - "Out-of-worktree holdout execution (--holdout-dir) without leaking tests into F1 worktree"
      - "Sanitized BlindReviewPacket strips worker identity, rationale, and self-reports"
      - "Seeded mutant canary check fails closed if holdout suite passes on mutated source"
    visible_tests:
      - "internal/verifier/blind_packet_test.go"
      - "internal/verifier/canary_test.go"
      - "cmd/g8s/verify_test.go"
    verifier_class: "test"
    blast_radius:
      depends_on:
        - "FEAT-VERIFY-01"
      direct_consumers:
        - "FEAT-F0-GATE-01"

  - id: "FEAT-F0-GATE-01"
    title: "Verified Delegation & Commitment-Point Gates T0-T4"
    persona_story: "As a system architect, I need T0-T4 reversibility tiers, commitment gates G0-G7, and provider-agnostic T3 independent verification with offline probe fallback."
    srs_reqs:
      - "FR-9"
    openspec_delta: "DELTA-24"
    code_paths:
      - "internal/supervisor/**"
      - "internal/orchestrator/**"
      - "internal/dialectic/**"
      - "internal/autopilot/**"
      - "internal/ladder/**"
      - "internal/review/**"
      - "tools/f0/**"
    invariants:
      - "Reversibility tiers T0-T4 and commitment checks G0-G7"
      - "Provider-agnostic T3 failover chain with blind diff sanitization and EvalProbeRunner fallback"
    visible_tests:
      - "internal/supervisor/supervisor_test.go"
      - "tools/f0/verifier_t3_test.go"
    verifier_class: "test"
    blast_radius:
      depends_on:
        - "FEAT-CONTROLPLANE-01"
        - "FEAT-VERIFY-01"
        - "FEAT-BLIND-VERIFY-01"
      direct_consumers: []

  - id: "FEAT-VAULT-MEMORY-01"
    title: "Decoupled Pure-Go Knowledge Vault & Memory Promotion"
    persona_story: "As a learning cognitive system, I need pure-Go knowledge vault storage with FTS5 search and memory promotion so that operational lessons persist across sessions."
    srs_reqs:
      - "FR-7"
    openspec_delta: "DELTA-10"
    code_paths:
      - "internal/vault/**"
      - "internal/memory/**"
      - "internal/lessons/**"
      - "internal/context/**"
    invariants:
      - "SQLite FTS5 full-text search"
      - "Second-brain promotion"
    visible_tests:
      - "internal/vault/vault_test.go"
      - "internal/memory/adapter_test.go"
    verifier_class: "test"
    blast_radius:
      depends_on:
        - "FEAT-CONTROLPLANE-01"
      direct_consumers: []

  - id: "FEAT-MCP-DAEMON-01"
    title: "MCP JSON-RPC Server & Cross-Platform Daemon Service"
    persona_story: "As an IDE or external agent host, I need a stdio JSON-RPC 2.0 MCP server and cross-platform HTTP daemon service so that g8s tools integrate seamlessly over standard protocols."
    srs_reqs:
      - "FR-5"
      - "FR-6"
    openspec_delta: "DELTA-05"
    code_paths:
      - "internal/mcp/**"
      - "internal/server/**"
      - "internal/service/**"
      - "cmd/g8s/serve.go"
    invariants:
      - "Stdio JSON-RPC 2.0 MCP server conformance"
      - "Cross-platform daemon service lifecycle"
    visible_tests:
      - "internal/mcp/server_test.go"
    verifier_class: "test"
    blast_radius:
      depends_on:
        - "FEAT-CONTROLPLANE-01"
        - "FEAT-FSOPS-01"
      direct_consumers:
        - "FEAT-PLATFORM-CLI-01"

  - id: "FEAT-DOCTOR-DIAG-01"
    title: "Platform Diagnostics, Telemetry & Workspace Hygiene"
    persona_story: "As an operator, I need automated health diagnostics, telemetry, and worktree cleanup so that local environment drift and orphaned worktrees are detected and remediated."
    srs_reqs:
      - "NFR-1"
      - "NFR-2"
    openspec_delta: "DELTA-05"
    code_paths:
      - "internal/doctor/**"
      - "internal/telemetry/**"
      - "internal/cleanup/**"
      - "internal/analyzer/**"
      - "cmd/g8s/doctor.go"
      - "cmd/g8s/cleanup.go"
      - "cmd/g8s/cleanup_worktrees.go"
    invariants:
      - "Non-destructive environment readiness probing"
      - "Safe worktree and state hygiene cleanup"
    visible_tests:
      - "cmd/g8s/cleanup_test.go"
      - "cmd/g8s/cleanup_worktrees_test.go"
    verifier_class: "test"
    blast_radius:
      depends_on:
        - "FEAT-CONTROLPLANE-01"
      direct_consumers:
        - "FEAT-PLATFORM-CLI-01"

  - id: "FEAT-PLATFORM-CLI-01"
    title: "Core Operator CLI Surface & Onboarding Wizard"
    persona_story: "As an operator or agent developer, I need a unified CLI envelope, interactive onboarding wizard, and shell completion so that platform commands are consistent and machine-readable."
    srs_reqs:
      - "FR-5"
      - "NFR-1"
    openspec_delta: "DELTA-05"
    code_paths:
      - "cmd/g8s/**"
      - "internal/cli/**"
      - "internal/initwiz/**"
      - "internal/completion/**"
    invariants:
      - "Deterministic JSON/JSONL CLI output envelopes"
      - "Zero-trust delegation flag validation"
    visible_tests:
      - "cmd/g8s/main_test.go"
      - "cmd/g8s/envelope_commands_test.go"
    verifier_class: "test"
    blast_radius:
      depends_on:
        - "FEAT-CONTROLPLANE-01"
        - "FEAT-WORKER-01"
        - "FEAT-LLMCALL-01"
        - "FEAT-ROUTING-LANE-01"
        - "FEAT-VERIFY-01"
        - "FEAT-MCP-DAEMON-01"
        - "FEAT-DOCTOR-DIAG-01"
      direct_consumers:
        - "FEAT-FEATUREMAP-01"

  - id: "FEAT-FEATUREMAP-01"
    title: "Declarative Feature Map & Blast Radius Routing"
    persona_story: "As a verification and routing harness, I need a declarative feature map and blast radius DAG so that task write scopes and test impacts are derived deterministically with zero package orphans."
    srs_reqs:
      - "FR-8"
    openspec_delta: "DELTA-23"
    code_paths:
      - "internal/featuremap/**"
      - "cmd/g8s/feature.go"
      - "tools/ci_feature_map_sync.sh"
    invariants:
      - "Zero-orphan package coverage across internal/"
      - "DAG acyclicity check"
    visible_tests:
      - "internal/featuremap/featuremap_test.go"
      - "cmd/g8s/feature_test.go"
    verifier_class: "test"
    blast_radius:
      depends_on:
        - "FEAT-PLATFORM-CLI-01"
      direct_consumers: []
