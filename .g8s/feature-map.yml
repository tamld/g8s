schema_version: "2.0"
# g8s Declarative End-to-End Feature Map (.g8s/feature-map.yml)
# Maps 15 single-responsibility functional feature nodes to SRS requirements,
# OpenSpec deltas, code paths, invariants, visible tests, verifier classes,
# and acyclic blast radius graphs.
#
# Schema 2.0 (DELTA-41) adds collision domains: per-feature exclusive
# owned_paths (`!` excludes a sub-region), shared_paths that must reference a
# declared hotspot, a collision_domain id, exported interfaces, and
# openspec_deltas (the legacy single-valued openspec_delta remains an alias).
# Every tracked file must be matched by exactly one owned_paths set or by a
# hotspot: `g8s feature verify --strict` enforces the partition and
# `g8s feature collisions` uses it to decide parallel-safe | split | serialize.

hotspots:
  - id: "HOT-CLI-MAIN"
    policy: "serialize"
    rationale: "Single top-level command switch and help text; every new subcommand adds a registration line here."
    paths:
      - "cmd/g8s/main.go"
      - "cmd/g8s/main_tasks_receipt.go"
      - "cmd/g8s/main_ops_worker.go"

  - id: "HOT-MANIFEST"
    policy: "serialize"
    rationale: "Machine-readable SSoT (deltas, roles, schemas); concurrent JSON edits conflict structurally."
    paths:
      - "manifest.json"

  - id: "HOT-AGENTS-FULL"
    policy: "append-only"
    rationale: "OpenSpec registry table; each delta appends one row."
    paths:
      - "docs/AGENTS_FULL.md"

  - id: "HOT-OPENSPEC-INDEX"
    policy: "append-only"
    rationale: "OpenSpec index table; each delta appends one row."
    paths:
      - "spec/openspec/README.md"

  - id: "HOT-README"
    policy: "serialize"
    rationale: "Public product surface; prose rewrites conflict."
    paths:
      - "README.md"
      - "README.vi.md"

  - id: "HOT-CLI-REFERENCE"
    policy: "owner:FEAT-PLATFORM-CLI-01"
    rationale: "Operator CLI reference; other features route command docs through the CLI surface owner."
    paths:
      - "docs/user-guide/cli-reference.md"

  - id: "HOT-CHANGELOG"
    policy: "append-only"
    rationale: "Release notes; entries are appended."
    paths:
      - "CHANGELOG.md"

  - id: "HOT-GO-MODULE"
    policy: "serialize"
    rationale: "Module graph; dependency bumps must be serialized to keep go.sum consistent."
    paths:
      - "go.mod"
      - "go.sum"

  - id: "HOT-BUILD-CI"
    policy: "serialize"
    rationale: "Shared build, lint, and CI gate infrastructure consumed by every feature."
    paths:
      - "Makefile"
      - ".github/**"
      - ".golangci.yml"
      - ".gitleaks.toml"
      - ".semgrep/**"
      - ".errcheck_excludes"
      - ".gitignore"
      - ".gitattributes"
      - ".g8s/coverage-baseline"
      - "tools/pre_push.sh"
      - "tools/pre_push_test.sh"
      - "tools/setup_hooks.sh"
      - "tools/ci_doc_contract_check.sh"
      - "tools/ci_layer_check*.sh"
      - "tools/ci_semgrep_check*.sh"
      - "tools/ci_coverage_ratchet*.sh"
      - "tools/ai_lint*.sh"
      - "tools/ci_pr_contract*.sh"

  - id: "HOT-CONSTITUTION"
    policy: "serialize"
    rationale: "Invariant laws; amendments are sovereign F0 decisions."
    paths:
      - "spec/constitution.md"

  - id: "HOT-OPENSPEC-DELTAS"
    policy: "append-only"
    rationale: "One new file per delta and living domain spec; edits to an existing delta are rare and owned by the delta author."
    paths:
      - "spec/openspec/**"
      - "!spec/openspec/README.md"
      - "spec/domains/**"

  - id: "HOT-ADR"
    policy: "append-only"
    rationale: "Architecture decision records; one new file per decision."
    paths:
      - "docs/decisions/**"

  - id: "HOT-PLANS"
    policy: "append-only"
    rationale: "Campaign ledgers and handoffs; new files per campaign."
    paths:
      - "plans/**"

  - id: "HOT-REFERENCE"
    policy: "serialize"
    rationale: "Frozen Python baseline; read-only reference, any write needs F0 sign-off."
    paths:
      - "reference/**"

  - id: "HOT-GOVERNANCE-DOCS"
    policy: "serialize"
    rationale: "Cross-cutting architecture, PRD/SRS, and governance prose not owned by a single feature."
    paths:
      - "docs/**"
      - "AGENTS.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "LICENSE"
      - "assets/**"
      - "!docs/AGENTS_FULL.md"
      - "!docs/decisions/**"
      - "!docs/user-guide/cli-reference.md"
      - "!docs/CLI_AND_EXPERIENCE_DESIGN.md"
      - "!docs/CODING_SIGNING.md"
      - "!docs/CONTEXTUAL_DISTILLATION_SPEC.md"
      - "!docs/DECOUPLED_MEMORY_ARCHITECTURE.md"
      - "!docs/DOD_DOR.md"
      - "!docs/RELEASE_READINESS.md"
      - "!docs/RELEASE_SOP.md"
      - "!docs/RELEASE_STRATEGY.md"
      - "!docs/SESSION_HYGIENE.md"
      - "!docs/SUPERVISOR_PATTERNS.md"
      - "!docs/VERSIONING.md"
      - "!docs/WINDOWS_INSTALL.md"
      - "!docs/claims.yml"
      - "!docs/designs/gate-lane-routing.md"
      - "!docs/designs/supervisor-fix-loop.md"
      - "!docs/examples/**"
      - "!docs/integrations/**"
      - "!docs/lessons/**"
      - "!docs/quickstart.md"
      - "!docs/user-guide/autopilot.md"
      - "!docs/user-guide/configuration.md"
      - "!docs/user-guide/effort.md"
      - "!docs/user-guide/mcp-tools.md"
      - "!docs/user-guide/performance.md"
      - "!docs/user-guide/provider-matrix.md"
      - "!docs/user-guide/providers.md"
      - "!docs/user-guide/receipt-workflow.md"
      - "!docs/user-guide/routing.md"
      - "!docs/user-guide/service.md"
      - "!docs/user-guide/tenancy.md"
      - "!docs/user-guide/verifier-and-autonomy.md"

features:
  - id: "FEAT-CONTROLPLANE-01"
    title: "Durable SQLite Control Plane & State Machine"
    persona_story: "As an autonomous agent, I need a durable SQLite WAL control plane with atomic CAS task transitions so that asynchronous workloads execute reliably across worker restarts."
    srs_reqs:
      - "FR-3"
      - "NFR-3"
    openspec_deltas:
      - "DELTA-03"
      - "DELTA-12"
      - "DELTA-15"
      - "DELTA-17"
    code_paths:
      - "internal/controlplane/**"
      - "internal/state/**"
      - "internal/lockfile/**"
      - "internal/heartbeat/**"
    collision_domain: "state-store"
    owned_paths:
      - "internal/controlplane/**"
      - "internal/state/**"
      - "internal/lockfile/**"
      - "internal/heartbeat/**"
      - "schemas/task-v1.schema.json"
      - "schemas/result-v1.schema.json"
    shared_paths:
      - "cmd/g8s/main.go"
      - "docs/user-guide/cli-reference.md"
    interfaces:
      cli:
        - "submit"
        - "get"
        - "tasks"
        - "cancel"
        - "resume"
        - "resubmit"
        - "lineage"
        - "children"
        - "state"
        - "migrate"
        - "audit"
      mcp_tools:
        - "g8s_submit"
        - "g8s_get"
        - "g8s_list_tasks"
        - "g8s_cancel_task"
      envelope_kinds:
        - "task"
        - "tasks"
        - "task_signal"
        - "task_signal_timeout"
        - "state"
        - "resubmit"
        - "audit_log"
      go_packages:
        - "internal/controlplane"
        - "internal/state"
        - "internal/lockfile"
        - "internal/heartbeat"
    invariants:
      - "State transitions follow pure WAL SQLite state machine"
      - "Atomic CAS task claiming"
    visible_tests:
      - "internal/controlplane/store_test.go"
      - "internal/state/state_test.go"
    verifier_class: "test"
    blast_radius:
      depends_on: []
      direct_consumers:
        - "FEAT-CHARTER-FEDERATION-01"
        - "FEAT-WORKER-01"
        - "FEAT-VERIFY-01"
        - "FEAT-F0-GATE-01"
        - "FEAT-VAULT-MEMORY-01"
        - "FEAT-MCP-DAEMON-01"
        - "FEAT-DOCTOR-DIAG-01"
        - "FEAT-PLATFORM-CLI-01"

