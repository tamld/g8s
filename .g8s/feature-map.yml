    title: "Orthogonal Stratum Federation & Epoch-Fenced Charter Engine"
    persona_story: "As a multi-repository FederationCoordinator (S1) or DomainGovernor (S2), I need orthogonal control strata (S0..S3 + O-Plane) and epoch-fenced SQLite WAL charters so that cross-repository delegation is mechanically bounded without conflating OS containment rings (F0/F1/F2)."
