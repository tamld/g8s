# agent-models.v1 — the supported-models effort catalog (issue #550)
# Transcribed EXCLUSIVELY from the 2026-10-04 research-verified data
# (3 agents against official docs; tables in
# plans/261004-effort-optimization/brief-AM1-catalog.md).
# Consumed later by the config.File loader (#550 DoD).

schema_version: agent-models.v1
catalog_version: 1
verified_at: "2026-10-04"
sources:
  - https://developers.openai.com/api/docs/models
  - https://developers.openai.com/api/docs/guides/reasoning
  - https://platform.claude.com/docs/en/docs/build-with-claude/effort
  - https://ai.google.dev/gemini-api/docs/thinking
  - https://docs.x.ai/developers/model-capabilities/text/reasoning
  - https://api-docs.deepseek.com/guides/reasoning_model
  - https://docs.mistral.ai/capabilities/reasoning/
  - https://openrouter.ai/docs/use-cases/reasoning-tokens

providers:
  openai:
    effort_style: named
    field: reasoning_effort        # reasoning.effort on the Responses API
    default_effort: adaptive
    mandatory: false
    notes: "o-series and gpt-5.1 deprecated (o-series shutdown 2026-10-23); adaptive reasoning is the default posture"
    models:
      - id: gpt-6-astra
        supported_efforts: [low, medium, high, xhigh, max]
        default_effort: adaptive
        notes: "no none; Chat Completions lacks function calling for this model — use Responses"
      - id: gpt-6.1-sol
        supported_efforts: [low, medium, high, xhigh, max]
        default_effort: medium
      - id: gpt-6-luna
        supported_efforts: [none, low, medium, high, xhigh, max]
        default_effort: adaptive
        notes: "only current model supporting none"
      - id: gpt-5.5
        supported_efforts: [none, minimal, low, medium, high, xhigh, max]
        default_effort: medium
      - id: gpt-5.5-pro
        supported_efforts: [none, minimal, low, medium, high, xhigh, max]
        default_effort: medium
      - id: gpt-5.6-sol
        supported_efforts: [none, minimal, low, medium, high, xhigh, max]
        default_effort: medium
      - id: gpt-5.6-terra
        supported_efforts: [none, minimal, low, medium, high, xhigh, max]
        default_effort: medium
      - id: gpt-5.6-luna
        supported_efforts: [none, minimal, low, medium, high, xhigh, max]
        default_effort: medium
      - id: gpt-5.6-cyber
        supported_efforts: [none, minimal, low, medium, high, xhigh, max]
        default_effort: medium

  anthropic:
    effort_style: named
    field: output_config.effort
    default_effort: high
    mandatory: false
    notes: "budget_tokens deprecated (rejected 400 on 4.7+ models); adaptive thinking mode on Opus 5.5 (cannot disable); per-message effort variant available"
    models:
      - id: claude-opus-5-5
        supported_efforts: [low, medium, high, xhigh, max]
        default_effort: medium
        notes: "adaptive always on; thinking cannot be disabled"
      - id: claude-sonnet-5-5
        supported_efforts: [low, medium, high, xhigh]
        default_effort: high
        notes: "thinking between_tools 400s at xhigh/max combos"
      - id: claude-fable-5-1
        supported_efforts: [low, medium, high, xhigh, max]
        default_effort: high
      - id: claude-haiku-4-5
        supported_efforts: []
        notes: "no effort support"

  google:
    effort_style: named
    field: thinking_level
    default_effort: dynamic
    mandatory: false
    notes: "dynamic = model-decided when omitted; thinkingBudget integer is legacy (do not set both)"
    models:
      - id: gemini-3.1-pro-preview
        supported_efforts: [minimal, low, medium, high]
        default_effort: dynamic
      - id: gemini-3.8-flash
        supported_efforts: [low, medium, high]
        default_effort: medium
      - id: gemini-3.5-flash
        supported_efforts: [minimal, low, medium, high]
        default_effort: dynamic
      - id: gemini-3.6-flash
        supported_efforts: [minimal, low, medium, high]
        default_effort: dynamic
      - id: gemini-3.7-flash
        supported_efforts: [minimal, low, medium, high]
        default_effort: dynamic
      - id: gemini-3.5-flash-lite
        supported_efforts: [minimal, high]
        default_effort: minimal
      - id: gemini-3.1-flash-lite
        supported_efforts: [minimal, high]
        default_effort: minimal

  xai:
    effort_style: named
    field: reasoning_effort
    default_effort: high
    mandatory: true
    notes: "reasoning cannot be disabled on current models"
    models:
      - id: grok-4.7
        supported_efforts: [low, medium, high, xhigh]
        default_effort: high
      - id: grok-4.6
        supported_efforts: [low, medium, high, xhigh]
        default_effort: high
      - id: grok-4.5
        supported_efforts: [low, medium, high]
        default_effort: high
        notes: "xhigh silently treated as high on this model"

  deepseek:
    effort_style: named
    field: reasoning_effort
    default_effort: medium
    mandatory: false
    notes: "V4 parameter-based: thinking:{type:'enabled'} + reasoning_effort; thinking default ON; omitting thinking = non-thinking (low-equivalent, recorded in notes not as a level)"
    models:
      - id: deepseek-flash
        supported_efforts: [medium, high]
        default_effort: medium
      - id: deepseek-v4-pro
        supported_efforts: [medium, high]
        default_effort: medium

  mistral:
    effort_style: named
    field: reasoning_effort
    default_effort: high
    mandatory: false
    notes: "magistral-* deprecated"
    models:
      - id: mistral-medium-3.5
        supported_efforts: [high, none]
        default_effort: high
      - id: mistral-small-latest
        supported_efforts: [high, none]
        default_effort: high
      - id: zai-glm-5-3
        supported_efforts: [low, high, max]
        notes: "hosted; output always chunk-list; none unsupported"

  ollama:
    effort_style: toggle
    field: think
    mandatory: false
    notes: "think is bool OR model-defined strings (gpt-oss: low/medium/high; qwen3/deepseek-r1: boolean); discovery via /api/show is mandatory per model; hard 400 on non-thinking models"
    models: []

  agy:
    effort_style: baked-name
    field: model-name-suffix
    default_effort: high
    mandatory: false
    # Sources:
    # - providers.json model list (observed variants: gemini-3.8-flash-low, gemini-3.8-flash-medium, gemini-3.8-flash-high)
    # - agy --help effort levels (low|medium|high|xhigh|max)
    # - live task evidence 237be821 (worker CLI accepts --effort matching suffix; refuses mismatches with "invalid model selection")
    notes: "model ids carry the effort suffix; the worker CLI accepts --effort only when it equals the id suffix; mismatched combos are refused (\"invalid model selection\")"
    models:
      - id: gemini-3.8-flash-low
        supported_efforts: [low]
        default_effort: low
      - id: gemini-3.8-flash-medium
        supported_efforts: [medium]
        default_effort: medium
      - id: gemini-3.8-flash-high
        supported_efforts: [high]
        default_effort: high

  9router:
    effort_style: named
    field: reasoning_effort
    default_effort: high
    mandatory: false
    notes: "9Router multi-model OpenAI/Anthropic gateway with combo failover (deep-coding, reasoning-high, docs-retriever, reasoning-free, fast-agent) and disjoint model-family routes (cl/anthropic/claude-sonnet-4.6, cl/anthropic/claude-haiku-4.5, cl/openai/gpt-4.1-mini, cl/google/gemini-2.5-flash)"
    models:
      - id: reasoning-free
        supported_efforts: [low, medium, high]
        default_effort: high
      - id: reasoning-high
        supported_efforts: [low, medium, high, xhigh, max]
        default_effort: high
      - id: deep-coding
        supported_efforts: [low, medium, high, xhigh]
        default_effort: high
      - id: fast-agent
        supported_efforts: [minimal, low, medium, high]
        default_effort: medium
      - id: docs-retriever
        supported_efforts: [low, medium, high]
        default_effort: medium

  opencode:
    effort_style: named
    field: reasoning_effort
    default_effort: medium
    mandatory: false
    notes: "OpenCode CLI built-in zero-cost (*free*) models verified live via opencode run"
    models:
      - id: opencode/beam-free
        supported_efforts: [low, medium, high]
        default_effort: medium
      - id: opencode/deepseek-v4.1-flash-free
        supported_efforts: [low, medium, high]
        default_effort: medium
      - id: opencode/flint-40b-free
        supported_efforts: [low, medium, high]
        default_effort: medium
      - id: opencode/glm-5.3-flash-free
        supported_efforts: [low, medium, high]
        default_effort: medium
      - id: opencode/mimo-v2.6-flash-free
        supported_efforts: [low, medium, high]
        default_effort: medium
      - id: opencode/nemotron-3.5-lightning-free
        supported_efforts: [low, medium, high]
        default_effort: medium
      - id: opencode/nemotron-3.5-super-vl-free
        supported_efforts: [low, medium, high]
        default_effort: medium

  commandcode:
    effort_style: named
    field: effort
    default_effort: medium
    mandatory: false
    notes: "Command Code CLI (v1.88.0): built-in $0 models (reflection/beam:free, poolside/laguna-s-2.1-free, stealth/glyph-cluster:free on Go+ plan) plus zero-cost BYOK models via ~/.commandcode/providers.json (9router/*)"
    models:
      - id: reflection/beam:free
        supported_efforts: [low, medium, high, xhigh, max]
        default_effort: medium
        notes: "Beam 1.0 (FREE) — $0/$0 token rate (requires Command Code Go+ plan or active credit balance)"
      - id: poolside/laguna-s-2.1-free
        supported_efforts: []
        notes: "Laguna S 2.1 (FREE) — $0/$0 token rate (requires Command Code Go+ plan or active credit balance)"
      - id: stealth/glyph-cluster:free
        supported_efforts: [low, medium, high, xhigh]
        default_effort: medium
        notes: "Glyph Cluster (FREE) — $0/$0 token rate (requires Command Code Go+ plan or active credit balance)"
      - id: 9router/docs-retriever
        supported_efforts: [low, medium, high]
        default_effort: medium
        notes: "Zero-cost BYOK via ~/.commandcode/providers.json -> 9router"
      - id: 9router/reasoning-free
        supported_efforts: [low, medium, high]
        default_effort: medium
        notes: "Zero-cost BYOK via ~/.commandcode/providers.json -> 9router"
      - id: 9router/fast-agent
        supported_efforts: [low, medium, high]
        default_effort: medium
        notes: "Zero-cost BYOK via ~/.commandcode/providers.json -> 9router"

  qwen:
    effort_style: named
    field: reasoning_effort
    default_effort: medium
    mandatory: false
    notes: "Qwen Code CLI (v0.15.9+): ready-to-use via ~/.qwen/settings.json OpenAI-compatible 9router gateway or Qwen OAuth free tier"
    models:
      - id: docs-retriever
        supported_efforts: [low, medium, high]
        default_effort: medium
      - id: reasoning-free
        supported_efforts: [low, medium, high]
        default_effort: medium

  cursor:
    effort_style: named
    field: effort
    default_effort: high
    mandatory: false
    notes: "Cursor Agent CLI (cursor-agent) & Cloud Agent API (https://api.cursor.com/v0/models) authenticated via CURSOR_API_KEY (#683)"
    models:
      - id: composer-2.5
        supported_efforts: [low, medium, high]
        default_effort: high
      - id: composer-2.5-fast
        supported_efforts: [low, medium, high]
        default_effort: medium
      - id: claude-opus-5-thinking-high
        supported_efforts: [high]
        default_effort: high
      - id: claude-sonnet-5-thinking-high
        supported_efforts: [high]
        default_effort: high
      - id: claude-fable-5-thinking-high
        supported_efforts: [high]
        default_effort: high
      - id: gpt-5.6-sol-high
        supported_efforts: [high]
        default_effort: high
      - id: gpt-5.6-luna-high
        supported_efforts: [high]
        default_effort: high
      - id: gemini-4-argon-high
        supported_efforts: [high]
        default_effort: high
      - id: gemini-3.7-flash-high
        supported_efforts: [high]
        default_effort: high
      - id: cursor-grok-4.6-high
        supported_efforts: [high]
        default_effort: high

