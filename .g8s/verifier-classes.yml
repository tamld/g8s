schema_version: "verifier-classes.v1"
# Verifier Classes Configuration (issue #515 / Wave H1, SCORECARD S-7)
# Maps task write-scope paths to machine verification check bundles.

classes:
  - name: docs
    status: advisory
    founding_catch: "#208 (docs drifted from code until the doc-contract gate existed)"
    priority: 10
    paths:
      - "*.md"
      - "docs/**"
      - "plans/**"
      - "skills/**"
      - "assets/**"
      - "offer/**"
    checks:
      - type: script
        run: tools/ci_doc_contract_check.sh
      - type: script
        run: tools/ci_link_integrity.sh

  - name: test
    status: advisory
    founding_catch: "#510 (the red-team suite's own vacuous seeds F1-F3, fixed by #512)"
    priority: 20
    paths:
      - "*_test.go"
      - "**/*_test.go"
      - "tools/**"
      - "plans/**"
    checks:
      - type: go-test
        packages: [] # Rule: empty packages list derives packages from touched Go files (preferring non-test files when present, or test files if test-only)

verification_skills:
  - name: g8s-blind-verifier
    entry: skills/g8s-blind-verifier/SKILL.md
    layer: L2_blind_packet
    gate_command: "./bin/g8s verify --blind --json"

  - name: g8s-red-prove
    entry: skills/g8s-red-prove/SKILL.md
    layer: L3_canary_mutant
    gate_command: "./bin/g8s verify --red-green --canary-mutant --json"

  - name: g8s-scenario-matrix
    entry: skills/g8s-scenario-matrix/SKILL.md
    layer: L1_holdout_suite
    gate_command: "./bin/g8s matrix gen --holdout-dir --json"

  - name: g8s-ux-visual-gate
    entry: skills/g8s-ux-visual-gate/SKILL.md
    layer: L2_ux_visual
    gate_command: "./bin/g8s verify-ux --json"

  - name: g8s-sec-gate
    entry: skills/g8s-sec-gate/SKILL.md
    layer: L2_security_boundary
    gate_command: "./bin/g8s sec probe --json"

  - name: g8s-epistemic-audit
    entry: skills/g8s-epistemic-audit/SKILL.md
    layer: L0_epistemic_purity
    gate_command: "./bin/g8s epistemic audit --json"
